name: Pull Request Conformance Checks

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-validate:
    name: Run Conformance Suite and Validate Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Bundle Integrity
        run: |
          python3 tests/validate_bundle.py

      - name: Run Python Core Conformance Suite
        run: |
          python3 singulyar_core.py

      - name: Check MANIFEST.sha256 Consistency
        run: |
          sha256sum -c MANIFEST.sha256
