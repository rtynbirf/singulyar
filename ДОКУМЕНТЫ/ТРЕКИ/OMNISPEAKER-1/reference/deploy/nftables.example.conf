# Пример фаервола ХОСТА-узла (агент/хаб). Сегментация VLAN выполняется на роутере; здесь — второй рубеж.
# Matter: порт по умолчанию UDP 5540; mDNS UDP 5353; Thread через OTBR.
table inet omni {
  set allowed_egress_v4 { type ipv4_addr; flags interval; }   # заполняется egress-proxy/DNS-фильтром
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    ip6 nexthdr icmpv6 accept                                 # NDP/RA — иначе Thread/Matter ломаются
    udp dport 5353 accept                                     # mDNS
    udp dport 5540 accept                                     # Matter operational
    tcp dport { 443 } ip saddr { 192.168.10.0/24 } accept     # Agent API только из VLAN10 (Trusted)
    tcp dport 8883 ip saddr { 192.168.20.0/24 } accept        # MQTT TLS только из VLAN20 (IoT)
  }
  chain output {
    type filter hook output priority 0; policy drop;
    ct state established,related accept
    oif lo accept
    ip daddr { 192.168.0.0/16 } accept                        # локальные сети (ужесточить по VLAN)
    udp dport { 53, 123 } ip daddr { 192.168.10.1 } accept    # локальный DNS/NTP
    tcp dport 443 ip daddr @allowed_egress_v4 accept          # только allowlist через egress-proxy
  }
}
