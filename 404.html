<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 · двери нет — СИНГУЛЯР</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0C">
<meta name="color-scheme" content="dark">
<style>
/* ДОМ СИНГУЛЯР · 404 — канон дома: стекло + void, золото — единственный акцент,
   ноль эмодзи, ноль внешних зависимостей (такт v10.20 «ЭТАЛОН», R-12) */
:root{--bg:#0A0A0C;--tx:#C0C8D0;--dim:#8A9099;--gold:#D4AF37;--gold2:#F0D78C;
      --mono:'Cascadia Mono',ui-monospace,Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);
  font:16px/1.65 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;overflow:hidden
}
.стекло{
  max-width:560px;width:100%;
  padding:44px 28px 40px;
  border:1px solid rgba(240,240,248,.14);border-radius:18px;
  background:rgba(18,20,24,.55);
  box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(240,240,248,.08)
}
.нить{
  width:1px;height:74px;margin:0 auto 26px;
  background:linear-gradient(180deg,rgba(212,175,55,0),rgba(212,175,55,.85) 30%,rgba(212,175,55,.85) 70%,rgba(240,215,140,0));
  box-shadow:0 0 12px rgba(212,175,55,.35)
}
h1{
  font-family:var(--mono);
  font-size:clamp(22px,5.6vw,30px);font-weight:400;letter-spacing:.18em;
  color:#EDEFF4;margin:0 0 10px
}
h1 i{font-style:normal;color:var(--gold)}
.тихо{color:var(--dim);font-size:15px;margin:0 0 28px}
.дверь{
  display:inline-block;font-family:var(--mono);font-size:13.5px;
  color:#C0C8D0;text-decoration:none;
  border:1px solid rgba(240,240,248,.18);border-radius:999px;
  padding:9px 18px;background:rgba(240,240,248,.03)
}
.дверь i{font-style:normal;color:var(--gold);margin-right:8px}
.дверь:hover,.дверь:focus-visible{border-color:rgba(212,175,55,.55);color:var(--gold2)}
.дверь:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.подпись{
  margin:26px 0 0;font-family:var(--mono);font-size:11px;
  letter-spacing:.32em;text-transform:uppercase;color:#B9A468
}
@media (max-width:420px){.стекло{padding:34px 18px 30px}}
</style>
</head>
<body>
<main class="стекло">
  <div class="нить" aria-hidden="true"></div>
  <h1><i>404</i> · двери нет</h1>
  <p class="тихо">такой двери в доме нет — вернись к первым</p>
  <a class="дверь" href="/singulyar/"><i>⌇</i>к лицу дома</a>
  <p class="подпись">СИНГУЛЯР</p>
</main>
</body>
</html>
