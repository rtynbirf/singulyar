<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛАКОРНИЯ — личный кинотеатр BL/GL</title>
<meta name="description" content="Персональный кинотеатр тайских BL/GL сериалов. Открой и смотри.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090f; --bg2:#0d0d16; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --txt:#f4f4f5; --mut:#9d9daa; --mut2:#67677a;
  --acc:#e879f9; --acc2:#8b5cf6; --grad:linear-gradient(93deg,#e879f9,#8b5cf6 60%,#6366f1);
  --ok:#34d399; --warn:#fbbf24; --r:18px; --rs:12px;
  --shadow:0 24px 70px -18px rgba(0,0,0,.75);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--txt);
  font-family:Manrope,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.55; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
::selection{background:rgba(232,121,249,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:rgba(232,121,249,.5)}
h1,h2,h3,.disp{font-family:Unbounded,Manrope,system-ui,sans-serif;letter-spacing:.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
a{color:inherit;text-decoration:none}
img{-webkit-user-drag:none;user-select:none}

/* ambient background */
.ambient{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.ambient::before,.ambient::after{content:'';position:absolute;width:52vw;height:52vw;border-radius:50%;filter:blur(120px);opacity:.16}
.ambient::before{background:#a21caf;top:-22vw;right:-14vw}
.ambient::after{background:#4f46e5;bottom:-26vw;left:-18vw;opacity:.14}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1px);background-size:3px 3px}

/* ============ HEADER ============ */
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:14px clamp(16px,4vw,44px);backdrop-filter:blur(18px);
  background:linear-gradient(180deg,rgba(9,9,15,.92),rgba(9,9,15,.66));border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:Unbounded;font-weight:800;font-size:17px;letter-spacing:.06em}
.logo .dot{width:26px;height:26px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:13px;box-shadow:0 4px 18px rgba(232,121,249,.45)}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hd-search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:8px 16px;color:var(--mut);cursor:pointer;min-width:210px;font-size:13.5px;transition:.25s}
.hd-search:hover{border-color:rgba(232,121,249,.5);color:var(--txt)}
.hd-search kbd{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;font-family:inherit}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;transition:.25s}
.icon-btn:hover{background:var(--card2);transform:translateY(-2px);box-shadow:0 8px 22px rgba(232,121,249,.22)}
.fav-count{font-size:11px;background:var(--grad);border-radius:99px;min-width:16px;height:16px;display:inline-grid;place-items:center;padding:0 4px;margin-left:4px;font-weight:800}

/* ============ HERO ============ */
.hero{position:relative;min-height:min(78vh,640px);display:flex;align-items:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 18%;filter:blur(2px) saturate(1.15);transform:scale(1.08)}
.hero-mask{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(9,9,15,.25) 0%,rgba(9,9,15,.55) 45%,var(--bg) 96%),
  linear-gradient(90deg,rgba(9,9,15,.86) 0%,rgba(9,9,15,.25) 55%,rgba(9,9,15,.7))}
.hero-in{position:relative;z-index:2;padding:0 clamp(16px,4vw,44px) 56px;max-width:760px}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#f0abfc;
  background:rgba(232,121,249,.1);border:1px solid rgba(232,121,249,.35);border-radius:99px;padding:6px 14px;margin-bottom:18px;backdrop-filter:blur(8px)}
.hero-tag .pulse{width:7px;height:7px;border-radius:50%;background:#e879f9;box-shadow:0 0 0 0 rgba(232,121,249,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(232,121,249,0)}}
.hero h1{font-size:clamp(28px,5vw,54px);font-weight:800;line-height:1.08;margin-bottom:14px;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#d4d4dd;max-width:560px;font-size:15.5px;margin-bottom:24px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid var(--line);backdrop-filter:blur(8px)}
.chip.gold{color:#fde68a;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.chip.bl{color:#93c5fd;border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.1)}
.chip.gl{color:#f9a8d4;border-color:rgba(244,114,182,.4);background:rgba(244,114,182,.1)}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:14px;padding:13px 26px;font-weight:800;font-size:14.5px;transition:.25s;letter-spacing:.02em}
.btn-prim{background:var(--grad);color:#fff;box-shadow:0 10px 32px rgba(232,121,249,.35)}
.btn-prim:hover{transform:translateY(-2px);box-shadow:0 16px 44px rgba(232,121,249,.5)}
.btn-ghost{background:rgba(255,255,255,.09);border:1px solid var(--line);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ============ ROWS ============ */
main{padding:8px 0 40px}
.row{margin:34px 0}
.row-hd{display:flex;align-items:baseline;gap:14px;padding:0 clamp(16px,4vw,44px);margin-bottom:14px}
.row-hd h2{font-size:clamp(17px,2vw,21px);font-weight:600}
.row-hd .cnt{color:var(--mut2);font-size:13px;font-weight:600}
.strip{display:flex;gap:14px;overflow-x:auto;padding:6px clamp(16px,4vw,44px) 18px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 168px;scroll-snap-align:start;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-7px) scale(1.045);z-index:3}
.card .ph{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:linear-gradient(160deg,#1c1530,#241a3d 55%,#160f26);box-shadow:0 10px 30px -8px rgba(0,0,0,.7)}
.card:hover .ph{box-shadow:0 20px 48px -8px rgba(232,121,249,.32)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover img{transform:scale(1.07)}
.card .ph .ph-txt{position:absolute;inset:0;display:grid;place-items:center;font-family:Unbounded;font-size:34px;color:rgba(255,255,255,.2)}
.rate{position:absolute;top:8px;left:8px;font-size:11.5px;font-weight:800;background:rgba(9,9,15,.78);backdrop-filter:blur(6px);border:1px solid rgba(251,191,36,.35);color:#fde68a;border-radius:8px;padding:3px 7px}
.type-tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;letter-spacing:.08em;border-radius:7px;padding:3px 7px;backdrop-filter:blur(6px)}
.type-tag.bl{background:rgba(59,130,246,.25);color:#bfdbfe;border:1px solid rgba(96,165,250,.4)}
.type-tag.gl{background:rgba(236,72,153,.25);color:#fbcfe8;border:1px solid rgba(244,114,182,.4)}
.card .tt{margin-top:9px;font-weight:700;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{font-size:11.5px;color:var(--mut2);margin-top:2px}
.pbar{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.14)}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:0 3px 3px 0}
.play-ic{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.3s;background:linear-gradient(180deg,transparent 30%,rgba(9,9,15,.72))}
.card:hover .play-ic{opacity:1}
.play-ic span{width:52px;height:52px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:20px;padding-left:4px;box-shadow:0 10px 30px rgba(232,121,249,.5)}
.fav-heart{position:absolute;bottom:9px;right:9px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:rgba(9,9,15,.72);backdrop-filter:blur(6px);border:1px solid var(--line);opacity:0;transition:.25s;z-index:2}
.card:hover .fav-heart{opacity:1}
.fav-heart.on{opacity:1;color:#f472b6;border-color:rgba(244,114,182,.5)}
.fav-heart:hover{transform:scale(1.15)}

/* top10 */
.t10{flex:0 0 auto;display:flex;align-items:flex-end;cursor:pointer;transition:.3s cubic-bezier(.2,.8,.2,1)}
.t10:hover{transform:translateY(-7px)}
.t10 .num{font-family:Unbounded;font-weight:800;font-size:96px;line-height:.78;color:transparent;
  -webkit-text-stroke:3px rgba(232,121,249,.55);margin-right:-26px;z-index:2;text-shadow:0 0 40px rgba(232,121,249,.25)}
.t10:hover .num{-webkit-text-stroke:3px rgba(232,121,249,.95)}
.t10 .ph{position:relative;width:130px;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.t10 img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.t10:hover img{transform:scale(1.06)}
.t10 .tt{width:130px;margin-top:8px;font-size:12.5px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ============ CATALOG ============ */
.catalog{padding:26px clamp(16px,4vw,44px)}
.cat-hd h2{font-size:clamp(20px,2.6vw,28px);margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;align-items:center}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px}
.tabs button{border-radius:99px;padding:8px 18px;font-weight:700;font-size:13px;color:var(--mut);transition:.25s}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(232,121,249,.35)}
.inp,.sel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 15px;color:var(--txt);font-size:13.5px;outline:none;transition:.25s}
.inp:focus,.sel:focus{border-color:rgba(232,121,249,.6);box-shadow:0 0 0 3px rgba(232,121,249,.15)}
.inp{min-width:230px}
.sel option{background:#14141f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:18px 14px}
.grid .card{width:auto;flex:none}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}
.pager{display:flex;gap:8px;justify-content:center;margin-top:30px}
.pager button{min-width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;transition:.2s}
.pager button.on{background:var(--grad);border-color:transparent}
.pager button:hover:not(.on){background:var(--card2)}
.res-count{color:var(--mut2);font-size:13px;margin-left:auto;font-weight:600}

/* ============ MODAL (series) ============ */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(6,6,11,.82);backdrop-filter:blur(14px);display:grid;place-items:center;padding:18px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(34px) scale(.98)}}
.modal{position:relative;width:min(1060px,100%);max-height:92vh;overflow-y:auto;border-radius:24px;
  background:linear-gradient(180deg,rgba(30,22,48,.92),rgba(13,13,22,.97));border:1px solid rgba(232,121,249,.16);
  box-shadow:var(--shadow);animation:up .35s cubic-bezier(.2,.8,.2,1)}
.modal::-webkit-scrollbar{width:8px}
.m-close{position:sticky;top:12px;margin-left:auto;margin-right:12px;z-index:5;width:38px;height:38px;border-radius:50%;
  background:rgba(9,9,15,.7);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;backdrop-filter:blur(8px)}
.m-close:hover{background:rgba(232,121,249,.25);transform:rotate(90deg);transition:.3s}
.m-hero{display:flex;gap:24px;padding:0 30px 22px;margin-top:-38px;flex-wrap:wrap}
.m-poster{flex:0 0 200px;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:#1c1530}
.m-poster img{width:100%;height:100%;object-fit:cover}
.m-info{flex:1;min-width:280px;padding-top:26px}
.m-info h3{font-size:clamp(20px,3vw,28px);font-weight:700;margin-bottom:6px}
.m-orig{color:var(--mut);font-size:13.5px;margin-bottom:14px}
.m-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.m-desc{color:#c9c9d6;font-size:14px;max-width:640px}
.m-acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.m-acts .btn{padding:11px 20px;font-size:13.5px}
.eps-wrap{padding:8px 30px 28px}
.eps-hd{display:flex;align-items:center;gap:12px;margin:14px 0 14px;flex-wrap:wrap}
.eps-hd h4{font-size:15px;font-weight:700}
.eps-hd .mini{font-size:12px;color:var(--mut2)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ep{position:relative;height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;
  font-weight:800;font-size:14px;transition:.2s;cursor:pointer}
.ep:hover{border-color:rgba(232,121,249,.6);background:rgba(232,121,249,.12);transform:translateY(-2px)}
.ep.watched{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.35);color:#a7f3d0}
.ep.cur{background:var(--grad);border-color:transparent;color:#fff}
.ep.no{opacity:.32;cursor:not-allowed}
.ep .tick{position:absolute;top:4px;right:6px;font-size:9px;color:var(--ok)}
.range-btn{border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);transition:.2s}
.range-btn.on{background:rgba(232,121,249,.18);border-color:rgba(232,121,249,.5);color:#f5d0fe}

/* ============ PLAYER ============ */
.player-ovl{position:fixed;inset:0;z-index:100;background:#050508;display:flex;flex-direction:column;animation:fade .3s}
.pl-top{display:flex;align-items:center;gap:14px;padding:14px clamp(14px,3vw,30px);border-bottom:1px solid var(--line)}
.pl-top .back{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--mut);transition:.2s}
.pl-top .back:hover{color:var(--txt)}
.pl-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-sub{color:var(--mut2);font-size:12.5px;white-space:nowrap}
.pl-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tgl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);cursor:pointer;user-select:none}
.tgl .sw{width:36px;height:20px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.25s}
.tgl .sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
.tgl.on .sw{background:var(--grad)}
.tgl.on .sw::after{left:18px}
.pl-body{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(10px,2.5vw,26px);min-height:0}
.pl-frame{position:relative;width:min(1240px,100%);max-height:100%;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 30px 90px -20px rgba(0,0,0,.9)}
.pl-frame iframe,.pl-frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pl-glow{position:absolute;inset:-60px;z-index:-1;background-size:cover;background-position:center;filter:blur(90px) brightness(.5);opacity:.55}
.pl-fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:linear-gradient(160deg,#170f2b,#0d0a1a)}
.pl-fallback .big{font-size:44px;margin-bottom:12px}
.pl-fallback h4{font-family:Unbounded;font-size:16px;margin-bottom:8px}
.pl-fallback p{color:var(--mut);font-size:13px;max-width:420px;margin:0 auto 16px}
.pl-bottom{padding:10px clamp(14px,3vw,30px) 18px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pl-bottom::-webkit-scrollbar{display:none}
.pl-nav{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pl-nav .btn{padding:9px 16px;font-size:12.5px}
.upnext{position:fixed;right:22px;bottom:96px;z-index:110;width:300px;border-radius:18px;padding:16px;
  background:linear-gradient(160deg,rgba(38,26,64,.97),rgba(16,14,28,.97));border:1px solid rgba(232,121,249,.4);
  box-shadow:0 24px 70px rgba(0,0,0,.8),0 0 40px rgba(232,121,249,.2);animation:up .3s}
.upnext .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#f0abfc;font-weight:800;margin-bottom:6px}
.upnext .t{font-weight:800;font-size:14.5px;margin-bottom:12px}
.upnext .acts{display:flex;gap:8px}
.upnext .acts .btn{flex:1;justify-content:center;padding:9px 10px;font-size:12.5px}
.upnext .cd{height:3px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}
.upnext .cd i{display:block;height:100%;width:100%;background:var(--grad);transition:width .95s linear}

/* ============ PALETTE ============ */
.cmdk{position:fixed;inset:0;z-index:120;background:rgba(6,6,11,.8);backdrop-filter:blur(10px);display:flex;justify-content:center;padding-top:12vh;animation:fade .2s}
.cmdk .box{width:min(600px,92vw);height:fit-content;max-height:64vh;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(28,22,46,.98),rgba(13,13,22,.98));border:1px solid rgba(232,121,249,.3);box-shadow:var(--shadow);animation:up .25s}
.cmdk input{background:transparent;border:none;outline:none;padding:18px 20px;font-size:16px;color:var(--txt);border-bottom:1px solid var(--line)}
.cmdk .lst{overflow-y:auto;padding:8px}
.cmdk .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:14px}
.cmdk .it.sel,.cmdk .it:hover{background:rgba(232,121,249,.14)}
.cmdk .it img{width:36px;height:54px;border-radius:7px;object-fit:cover;flex:none}
.cmdk .it .ic{width:36px;height:36px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:16px;flex:none}
.cmdk .it .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk .it .sc{font-size:12px;color:var(--mut2)}
.cmdk .it kbd{margin-left:auto;font-size:11px;color:var(--mut2);background:rgba(255,255,255,.06);border-radius:6px;padding:2px 8px}
.cmdk .sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);padding:10px 12px 4px;font-weight:800}
.cmdk .empty{padding:34px}

/* ============ FOOTER / TOAST ============ */
footer{padding:34px clamp(16px,4vw,44px) 44px;color:var(--mut2);font-size:13px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);z-index:200;background:rgba(20,16,34,.96);

<script>
/* ============ ЛАКОРНИЯ · standalone engine ============ */
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const S = DATA.s;                                  // series list
const byId = Object.fromEntries(S.map(x => [x.id, x]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let progress = LS.get('lakornia:progress', {});    // {sid:{ep,w:{n:1},ts}}
let favs     = LS.get('lakornia:favorites', []);   // [sid]
let autoplay = LS.get('lakornia:autoplay', true);
let watchedOnly = false;
const saveMeta = () => { LS.set('lakornia:progress', progress); LS.set('lakornia:favorites', favs); LS.set('lakornia:autoplay', autoplay) };

const linked = x => x.eps.filter(e => e.u);
const watchedCount = sid => { const p = progress[sid]; if (!p?.w) return 0; return Object.keys(p.w).length };
const pct = x => x.eps.length ? Math.round(watchedCount(x.id) / x.eps.length * 100) : 0;

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600);
}

/* ---------- embed logic ---------- */
// === МЕГАПЛЕЕР: Universal source detection + multi-source fallback chain ===
function embedUrls(url, ap) {
  // Returns ARRAY of fallback URLs — player tries each in order until one works
  const A = ap ? 1 : 0;
  let u;
  try { u = new URL(url) } catch { return [{ direct: url }] }
  const h = u.hostname.replace(/^www\./, '').replace(/^m\./, '');
  const out = [];

  // === YouTube — try multiple frontends (sovereign first, then YouTube) ===
  if (h === 'youtube.com' || h === 'm.youtube.com') {
    let vid = '';
    if (u.pathname === '/watch') vid = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(shorts|embed)\/([\w-]+)/); if (m) vid = m[2] }
    if (vid) {
      // Sovereign Piped frontends first (no ads, no Google tracking)
      out.push(`https://piped.video/embed/${vid}`);
      out.push(`https://piped.kavin.rocks/embed/${vid}`);
      out.push(`https://pipedapi.private.coffee/embed/${vid}`);
      // Invidious fallbacks (sovereign YouTube frontends)
      out.push(`https://yewtu.be/embed/${vid}`);
      out.push(`https://inv.nadeko.net/embed/${vid}`);
      // Last resort: YouTube nocookie (Google but no ads)
      out.push(`https://www.youtube-nocookie.com/embed/${vid}?rel=0&autoplay=${A}&modestbranding=1`);
      // Final: YouTube direct (Google, ads)
      out.push(`https://www.youtube.com/embed/${vid}?rel=0&autoplay=${A}&modestbranding=1`);
      return out;
    }
  }
  if (h === 'youtu.be') {
    const vid = u.pathname.slice(1);
    out.push(`https://piped.video/embed/${vid}`);
    out.push(`https://piped.kavin.rocks/embed/${vid}`);
    out.push(`https://yewtu.be/embed/${vid}`);
    out.push(`https://www.youtube-nocookie.com/embed/${vid}?rel=0&autoplay=${A}`);
    return out;
  }
  // === Dailymotion ===
  if (h === 'dailymotion.com' || h === 'geo.dailymotion.com' || h === 'dai.ly') {
    let vid = '';
    const m = u.pathname.match(/video\/([a-z0-9]+)/i);
    if (m) vid = m[1];
    else if (h === 'dai.ly') vid = u.pathname.slice(1);
    if (vid) {
      out.push(`https://www.dailymotion.com/embed/video/${vid}?autoplay=${A}`);
      out.push(`https://geo.dailymotion.com/#video=${vid}`);
      return out;
    }
  }
  // === Rutube ===
  if (h === 'rutube.ru') {
    const m = u.pathname.match(/video\/([a-z0-9]+)/i) || u.pathname.match(/play\/embed\/([a-z0-9]+)/i);
    if (m) {
      out.push(`https://rutube.ru/play/embed/${m[1]}?autoplay=${A}`);
      return out;
    }
  }
  // === VK Video ===
  if (h === 'vk.com' || h === 'vkvideo.ru' || h === 'vk.ru') {
    if (u.pathname.includes('video_ext')) return [url + (ap ? '&autoplay=1' : '')];
    const m = (u.pathname + u.search).match(/video(-?\d+)_(\d+)/);
    if (m) {
      out.push(`https://vk.com/video_ext.php?oid=${m[1]}&id=${m[2]}&hd=2&autoplay=${A}`);
      return out;
    }
  }
  // === Sibnet ===
  if (h === 'video.sibnet.ru') {
    if (u.pathname.includes('shell.php')) return [url];
    const id = u.searchParams.get('videoid') || (u.pathname.match(/(\d+)\.html?$/) || [])[1];
    if (id) {
      out.push(`https://video.sibnet.ru/shell.php?videoid=${id}`);
      return out;
    }
  }
  // === Direct video files ===
  if (/\.(mp4|webm|ogg|mov|m4v)$/i.test(u.pathname)) return [{ direct: url }]
  // === HLS streams (m3u8) ===
  if (u.pathname.endsWith('.m3u8') || u.pathname.includes('/hls/')) return [{ hls: url }]
  // === Magnet/torrent ===
  if (url.startsWith('magnet:')) return [{ magnet: url }]
  if (url.endsWith('.torrent')) return [{ torrent: url }]
  // === Kodik/Alloha/Myvi/other embeds — pass through ===
  return [url];
}
const hostName = u => { try { return new URL(u).hostname.replace(/^www\./, '').replace(/^m\./, '') } catch { return 'источник' } };

/* ---------- card ---------- */
function cardHTML(x, opts = {}) {
  const p = pct(x);
  const fav = favs.includes(x.id);
  return `<div class="card" data-id="${x.id}">
    <div class="ph">
      ${x.p ? `<img loading="lazy" src="${esc(x.p)}" alt="${esc(x.t)}" onerror="this.style.display='none'">` : `<div class="ph-txt">${esc(x.t[0])}</div>`}
      <span class="rate">★ ${x.r ?? '—'}</span>
      <span class="type-tag ${x.ty.toLowerCase()}">${x.ty}</span>
      ${p ? `<div class="pbar"><i style="width:${p}%"></i></div>` : ''}
      <div class="play-ic"><span>▶</span></div>
      <button class="fav-heart ${fav ? 'on' : ''}" data-fav="${x.id}" title="В избранное">♥</button>
    </div>
    <div class="tt">${esc(x.t)}</div>
    <div class="sub">${x.y} · ${opts.sub || linked(x).length + ' сер. с видео'}</div>
  </div>`;
}
function bindCards(root) {
  root.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', e => {
      if (e.target.closest('[data-fav]')) { toggleFav(+e.target.closest('[data-fav]').dataset.fav); return }
      openSeries(+c.dataset.id);
    });
  });
}
function toggleFav(id) {
  favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
  saveMeta(); updateFavCount(); toast(favs.includes(id) ? '♥ В избранном' : 'Убрано из избранного');
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => b.classList.toggle('on', favs.includes(id)));
  if (curView === 'fav') renderCatalog(); renderRows();
}
function updateFavCount() {
  const el = $('#favCount'); el.hidden = !favs.length; el.textContent = favs.length;
}

/* ---------- rows ---------- */
function renderRows() {
  const rows = [];
  // Продолжить
  const cont = Object.entries(progress)
    .filter(([sid, p]) => byId[+sid] && p.ep)
    .sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0)).slice(0, 12)
    .map(([sid]) => byId[+sid]);
  if (cont.length) rows.push({ id: 'cont', title: '▶ Продолжить просмотр', sub: 'с того места, где остановился', list: cont, subFn: x => { const p = progress[x.id]; const nx = nextUnwatched(x); return p && p.ep ? `ты на серии ${p.ep}` : 'с начала' } });
  // Избранное
  const fl = favs.map(i => byId[i]).filter(Boolean);
  if (fl.length) rows.push({ id: 'fav', title: '♥ Избранное', list: fl });
  // Top10
  const top = [...S].sort((a, b) => b.r - a.r).slice(0, 10);
  rows.push({ id: 'top', title: '🏆 Топ-10 в твоей коллекции', top10: true, list: top });
  // Новинки
  rows.push({ id: 'new', title: '✨ Новинки 2025–26', list: S.filter(x => x.y >= 2025).sort((a, b) => b.r - a.r) });
  // BL / GL
  rows.push({ id: 'bl', title: '🔥 BL-хиты', list: S.filter(x => x.ty === 'BL').sort((a, b) => b.r - a.r) });
  rows.push({ id: 'gl', title: '🌸 GL-хиты', list: S.filter(x => x.ty === 'GL').sort((a, b) => b.r - a.r) });

  const root = $('#rows');
  root.innerHTML = rows.map(r => {
    if (!r.list.length) return '';
    const items = r.list.map((x, i) => r.top10
      ? `<div class="t10" data-id="${x.id}"><span class="num">${i + 1}</span>
          <div><div class="ph">${x.p ? `<img loading="lazy" src="${esc(x.p)}" alt="" onerror="this.style.display='none'">` : ''}
          <span class="rate">★ ${x.r}</span></div><div class="tt">${esc(x.t)}</div></div></div>`
      : cardHTML(x, r.subFn ? { sub: r.subFn(x) } : {}));
    return `<section class="row reveal" id="row-${r.id}">
      <div class="row-hd"><h2>${r.title}</h2><span class="cnt">${r.list.length}</span></div>
      <div class="strip">${items.join('')}</div></section>`;
  }).join('');
  bindCards(root);
  root.querySelectorAll('.t10').forEach(el => el.addEventListener('click', () => openSeries(+el.dataset.id)));
  observeReveal();
}

/* ---------- hero ---------- */
function renderHero() {
  const x = [...S].sort((a, b) => b.r - a.r).find(s => s.p && linked(s).length) || S[0];
  const epsN = linked(x).length;
  $('#hero').innerHTML = `
    <div class="hero-bg" style="background-image:url('${esc(x.p)}')"></div><div class="hero-mask"></div>
    <div class="hero-in">
      <span class="hero-tag"><span class="pulse"></span>Личная коллекция · без рекламы · без регистрации</span>
      <h1>Твой кинотеатр <em>BL · GL</em><br>который сам находит серии</h1>
      <p>${esc(x.t)} — ★ ${x.r}, ${x.y}. ${esc((x.d || '').slice(0, 150))}…</p>
      <div class="hero-meta">
        <span class="chip gold">★ ${x.r} рейтинг</span><span class="chip ${x.ty.toLowerCase()}">${x.ty}</span>
        <span class="chip">${epsN} серий с видео</span>${x.g.slice(0, 3).map(g => `<span class="chip">${esc(g)}</span>`).join('')}
      </div>
      <div class="hero-actions">
        <button class="btn btn-prim" id="heroPlay">▶ Смотреть «${esc(x.t)}»</button>
        <button class="btn btn-ghost" id="heroLucky">🎲 Мне повезёт</button>
      </div>
    </div>`;
  $('#heroPlay').onclick = () => openSeries(x.id, true);
  $('#heroLucky').onclick = lucky;
}

/* ---------- catalog ---------- */
let curView = 'grid', page = 1, PER = 24;
const state = { t: 'ALL', q: '', g: '', y: '', sort: 'rating' };
function filtered() {
  let l = S.filter(x =>
    (state.t === 'ALL' || x.ty === state.t) &&
    (!state.g || x.g.includes(state.g)) &&
    (!state.y || x.y === +state.y) &&
    (!state.q || (x.t + ' ' + x.o).toLowerCase().includes(state.q.toLowerCase()))
  );
  if (curView === 'fav') l = l.filter(x => favs.includes(x.id));
  if (watchedOnly) l = l.filter(x => pct(x) === 100);
  const s = state.sort;
  l.sort((a, b) => s === 'year' ? b.y - a.y : s === 'title' ? a.t.localeCompare(b.t, 'ru') : s === 'eps' ? linked(b).length - linked(a).length : b.r - a.r);
  return l;
}
function renderCatalog() {
  const l = filtered();
  const pages = Math.max(1, Math.ceil(l.length / PER));
  if (page > pages) page = 1;
  const slice = l.slice((page - 1) * PER, page * PER);
  $('#resCount').textContent = `${l.length} тайтлов`;
  const grid = $('#grid');
  grid.innerHTML = slice.length ? slice.map(x => cardHTML(x)).join('')
    : `<div class="empty">Ничего не найдено. Попробуй другой фильтр 🎲</div>`;
  bindCards(grid);
  $('#pager').innerHTML = pages > 1 ? Array.from({ length: pages }, (_, i) =>
    `<button class="${page === i + 1 ? 'on' : ''}" data-p="${i + 1}">${i + 1}</button>`).join('') : '';
  $('#pager').querySelectorAll('button').forEach(b => b.onclick = () => {
    page = +b.dataset.p; renderCatalog();
    $('#catalog').scrollIntoView({ behavior: 'smooth' });
  });
}

/* ---------- series modal ---------- */
let modalSid = null, epRange = 24;
function openSeries(id, autoPlay = false) {
  modalSid = id;
  const x = byId[id]; if (!x) return;
  const fav = favs.includes(id);
  const p = progress[id];
  const eps = x.eps;
  const epsHTML = n0 => eps.filter(e => e.n >= n0 && e.n < n0 + epRange).map(e => {
    const w = p?.w?.[e.n], cur = p?.ep === e.n;
    return `<button class="ep ${w ? 'watched' : ''} ${cur ? 'cur' : ''} ${!e.u ? 'no' : ''}" data-ep="${e.n}" ${!e.u ? 'disabled title="Ссылка не найдена — Автопилот не осилил"' : ''}>
      ${e.n}${w ? '<span class="tick">✓</span>' : ''}</button>`;

      <div class="m-info">

        <div class="m-chips">
          <span class="chip gold">★ ${x.r}</span><span class="chip ${x.ty.toLowerCase()}">${x.ty}</span>
          ${x.g.map(g => `<span class="chip">${esc(g)}</span>`).join('')}
          <span class="chip">${linked(x).length}/${x.eps.length} серий с видео</span>
        </div>
        <p class="m-desc">${esc(x.d)}</p>
        <div class="m-acts">
          <button class="btn btn-prim" id="mPlay">${p?.ep ? '▶ Продолжить с серии ' + p.ep : '▶ Смотреть с 1-й серии'}</button>
          <button class="btn btn-ghost" data-fav="${id}">${fav ? '♥ В избранном' : '♡ В избранное'}</button>
          <button class="btn btn-ghost" id="mRandom">🎲 Случайная серия</button>
        </div>
      </div>
    </div>
    <div class="eps-wrap">
      <div class="eps-hd"><h4>Эпизоды</h4><span class="mini">✓ — просмотрено · ✕ — нет ссылки</span>
        ${ranges ? `<span style="display:flex;gap:6px;flex-wrap:wrap">${ranges}</span>` : ''}</div>
      <div class="eps">${epsHTML(1)}</div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  ov.addEventListener('click', e => {
    if (e.target === ov || e.target.closest('[data-close]')) closeModal();
    const ep = e.target.closest('[data-ep]:not(.no)');
    if (ep) { openPlayer(id, +ep.dataset.ep); return }
    const f = e.target.closest('[data-fav]');
    if (f) { toggleFav(+f.dataset.fav); f.textContent = favs.includes(+f.dataset.fav) ? '♥ В избранном' : '♡ В избранное' }
  });
  ov.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    ov.querySelectorAll('.range-btn').forEach(z => z.classList.remove('on')); b.classList.add('on');
    ov.querySelector('.eps').innerHTML = epsHTML(+b.dataset.r);

  $('#mPlay', ov).onclick = () => { const nx = resumeEp(x); openPlayer(id, nx) };
  $('#mRandom', ov).onclick = () => { const l = linked(x); if (l.length) openPlayer(id, l[Math.floor(Math.random() * l.length)].n) };
  if (autoPlay) { const nx = resumeEp(x); openPlayer(id, nx, true) }
}
function closeModal() { $('#sOvl')?.remove(); if (!$('#pOvl')) document.body.style.overflow = '' }
function resumeEp(x) {
  const p = progress[x.id];
  if (p?.ep) return p.ep;
  return nextUnwatched(x)?.n ?? linked(x)[0]?.n ?? 1;
}
function nextUnwatched(x) {
  const w = progress[x.id]?.w || {};
  return x.eps.find(e => e.u && !w[e.n]) || null;
}

/* ---------- player ---------- */
let cdTimer = null; // pl объявлен ниже в блоке МЕГАПЛЕЕРА (фикс двойного let pl — парсер убивал весь сайт)
// === МЕГАПЛЕЕР: universal player for ALL formats ===
// Supports: iframe embeds (YouTube/Rutube/DM/VK/Sibnet/Piped/Invidious), direct mp4/webm,
// HLS (m3u8) via hls.js, magnet/.torrent via WebTorrent
// NO 5-second auto-next — only switches when video ACTUALLY ends (detected via 'ended' event)
let pl = null, plFallbackIdx = 0, plSources = [];
function openPlayer(sid, epN, fromAuto = false) {
  $('#pOvl')?.remove(); $('#upnext')?.remove(); clearTimeout(cdTimer);
  const x = byId[sid]; const ep = x.eps.find(e => e.n === epN);
  if (!ep || !ep.u) { toast('У этой серии нет ссылки 😔 — попробуй другую'); return }
  closeModal(); document.body.style.overflow = 'hidden';
  // Mark progress
  const pr = progress[sid] = progress[sid] || { w: {} };
  pr.ep = epN; pr.w = pr.w || {}; pr.w[epN] = 1; pr.ts = Date.now();
  saveMeta();

  const prev = [...x.eps].reverse().find(e => e.n < epN && e.u);
  const next = x.eps.find(e => e.n > epN && e.u);
  
  // Get all fallback URLs for this source
  plSources = embedUrls(ep.u, autoplay);
  plFallbackIdx = 0;
  const isVideo = typeof plSources[0] === 'object';
  const isHls = isVideo && plSources[0].hls;
  const isMagnet = isVideo && (plSources[0].magnet || plSources[0].torrent);
  const srcUrl = isVideo ? (plSources[0].direct || plSources[0].hls || plSources[0].magnet || plSources[0].torrent) : plSources[0];

  const ov = document.createElement('div');
  ov.className = 'player-ovl'; ov.id = 'pOvl';
  ov.innerHTML = `
    <div class="pl-top">
      <button class="back" id="plBack">← Назад</button>
      <div><div class="pl-title">${esc(x.t)} — серия ${epN}</div>
        <div class="pl-sub" id="plSub">источник: ${hostName(ep.u)} · загрузка...</div></div>
      <div class="pl-right">
        <label class="tgl ${autoplay ? 'on' : ''}" id="apTgl"><span>Авто-плей</span><span class="sw"></span></label>
        <button class="icon-btn" id="plBad" title="Источник не отвечает? Пробуй следующий">⚠</button>
        <button class="icon-btn" id="plClose">✕</button>
      </div>
    </div>
    <div class="pl-body">
      <div class="pl-frame">
        <div class="pl-glow" style="background-image:url('${esc(x.p)}')"></div>
        <div id="plLoading" style="position:absolute;inset:0;display:grid;place-items:center;color:#7a8a84;background:#000">
          <div style="text-align:center">
            <div style="font-size:48px;margin-bottom:14px">⏳</div>
            <div id="plLoadingText">Загрузка источника 1/${plSources.length}...</div>
          </div>
        </div>
        ${isVideo && !isHls && !isMagnet
          ? `<video src="${esc(srcUrl)}" controls autoplay playsinline id="plVideo" style="display:none"></video>`
          : isHls
          ? `<video controls autoplay playsinline id="plVideo" style="display:none"></video>`
          : isMagnet
          ? `<video controls autoplay playsinline id="plVideo" style="display:none"></video>`
          : `<iframe src="${esc(srcUrl)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin" id="plFrame" style="display:none"></iframe>`
        }
        <div class="pl-fallback" id="plFail" hidden>
          <div class="big">🔇</div>
          <h4>Источник не отвечает</h4>
          <p id="plFailMsg">Видео не загрузилось. Возможно, embed закрыт или удалён.</p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            ${plSources.length > 1 ? `<button class="btn btn-prim" id="failNext">↻ Попробовать другой источник (${plFallbackIdx + 1}/${plSources.length})</button>` : ''}
            <a class="btn btn-ghost" href="${esc(ep.u)}" target="_blank">↗ Открыть в источнике</a>
            ${next ? `<button class="btn btn-ghost" id="failSkip">Следующая серия →</button>` : ''}
          </div>
        </div>
      </div>
    </div>
    <div class="pl-bottom">
      <div class="pl-nav">
        ${prev ? `<button class="btn btn-ghost" id="plPrev">← Серия ${prev.n}</button>` : ''}
        ${next ? `<button class="btn btn-prim" id="plNext">Серия ${next.n} →</button>` : '<span class="chip">Это последняя серия с видео 🎉</span>'}
        <button class="btn btn-ghost" id="plUnw"><b id="unwState">✓</b></button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${x.eps.map(e => `<button class="ep ${progress[sid]?.w?.[e.n] ? 'watched' : ''} ${e.n === epN ? 'cur' : ''} ${!e.u ? 'no' : ''}" data-pep="${e.n}" style="min-width:52px" ${!e.u ? 'disabled' : ''}>${e.n}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(ov);

  // === Source loading logic ===
  const loading = $('#plLoading', ov);
  const loadingText = $('#plLoadingText', ov);
  const sub = $('#plSub', ov);
  const fail = $('#plFail', ov);
  const failMsg = $('#plFailMsg', ov);

  function tryNextSource(reason) {
    plFallbackIdx++;
    if (plFallbackIdx >= plSources.length) {
      // All sources exhausted — show fallback UI
      loading.style.display = 'none';
      fail.hidden = false;
      failMsg.textContent = `Все ${plSources.length} источников не ответили: ${reason}`;
      return;
    }
    const nextSrc = plSources[plFallbackIdx];
    const nextUrl = typeof nextSrc === 'object' ? (nextSrc.direct || nextSrc.hls || nextSrc.magnet || nextSrc.torrent) : nextSrc;
    loading.style.display = 'grid';
    loadingText.textContent = `Источник ${plFallbackIdx + 1}/${plSources.length}...`;
    sub.textContent = `источник: ${hostName(nextUrl)} · попытка ${plFallbackIdx + 1}/${plSources.length}`;
    
    const frame = $('#plFrame', ov);
    if (frame) {
      frame.src = nextUrl;
      frame.style.display = 'none';
    }
    // Reset timeout
    scheduleLoadTimeout();
  }

  let loadTimer = null;
  function scheduleLoadTimeout() {
    clearTimeout(loadTimer);
    // 12 seconds to start playing, else try next source
    loadTimer = setTimeout(() => {
      const frame = $('#plFrame', ov);
      const vid = $('#plVideo', ov);
      if (frame) {
        // For iframe — can't reliably detect, but if still loading after 12s, try next
        if (loading.style.display !== 'none') {
          tryNextSource('iframe timeout (12s)');
        }
      } else if (vid) {
        // For direct video — check if it's actually playing
        if (vid.readyState < 2) {
          tryNextSource('video not buffering');
        }
      }
    }, 12000);
  }
  scheduleLoadTimeout();

  // For <video> element — listen for events
  const vid = $('#plVideo', ov);
  if (vid) {
    vid.addEventListener('loadeddata', () => {
      loading.style.display = 'none';
      vid.style.display = 'block';
      clearTimeout(loadTimer);
      sub.textContent = `▶ проигрывается: ${hostName(srcUrl)}`;
    });
    vid.addEventListener('playing', () => {
      loading.style.display = 'none';
      vid.style.display = 'block';
      clearTimeout(loadTimer);
    });
    vid.addEventListener('error', () => {
      tryNextSource('video error');
    });
    // === KEY FIX: Only auto-next when video ACTUALLY ENDS ===
    vid.addEventListener('ended', () => {
      if (autoplay && next) {
        openPlayer(x.id, next.n);
      }
    });
    
    // For HLS, attach hls.js
    if (isHls) {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
      script.onload = () => {
        if (window.Hls && Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(srcUrl);
          hls.attachMedia(vid);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            loading.style.display = 'none';
            vid.style.display = 'block';
            clearTimeout(loadTimer);
            vid.play();
          });
          hls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) tryNextSource('HLS error');
          });
        } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
          vid.src = srcUrl;
          vid.play();
        }
      };
      document.head.appendChild(script);
    }
    // For magnet/torrent — use WebTorrent
    if (isMagnet) {
      if (window.WebTorrent) {
        const client = new WebTorrent();
        client.add(srcUrl, function(torrent) {
          const file = torrent.files.find(f => /\.(mp4|mkv|webm|mov)$/i.test(f.name));
          if (file) {
            file.renderTo('#plVideo', {autoplay: true, controls: true}, () => {
              loading.style.display = 'none';
              clearTimeout(loadTimer);
              sub.textContent = `🧲 P2P: ${torrent.numPeers} peers · ${Math.round(torrent.progress*100)}%`;
            });
          }
        });
      } else {
        tryNextSource('WebTorrent not loaded');
      }
    }
  }
  
  // For iframe — listen for load event
  const frame = $('#plFrame', ov);
  if (frame) {
    frame.addEventListener('load', () => {
      // Iframe loaded but we can't detect if video actually plays (CORS)
      // Wait additional 8s, then assume it's playing
      setTimeout(() => {
        loading.style.display = 'none';
        frame.style.display = 'block';
        clearTimeout(loadTimer);
        sub.textContent = `▶ проигрывается: ${hostName(srcUrl)}`;
      }, 2000);
    });
    frame.addEventListener('error', () => tryNextSource('iframe error'));
  }

  // Wire buttons
  $('#plClose', ov).onclick = closePlayer;
  $('#plBack', ov).onclick = () => { closePlayer(); openSeries(sid) };
  $('#apTgl', ov).onclick = e => { autoplay = !autoplay; LS.set('lakornia:autoplay', autoplay); e.currentTarget.classList.toggle('on', autoplay); toast(autoplay ? 'Авто-плей включён' : 'Авто-плей выключен') };
  $('#plBad', ov).onclick = () => tryNextSource('manual switch');
  fail.addEventListener('click', e => {
    if (e.target.id === 'failNext') tryNextSource('manual');
    if (e.target.id === 'failSkip' && next) openPlayer(sid, next.n);
  });
  if (prev) $('#plPrev', ov).onclick = () => openPlayer(sid, prev.n);
  if (next) $('#plNext', ov).onclick = () => openPlayer(sid, next.n);
  $('#plUnw', ov).onclick = () => {
    const w = progress[sid].w;
    if (w[epN]) { delete w[epN]; toast('Отметка снята') } else { w[epN] = 1; toast('✓ Отмечено') }
    saveMeta(); $('#unwState', ov).textContent = w[epN] ? '✓' : '—';
  };
  ov.querySelectorAll('[data-pep]').forEach(b => b.onclick = () => openPlayer(sid, +b.dataset.pep));
  
  // NO auto-show-up-next here — only via video 'ended' event (handled above)
  renderRows();
}

function showUpNext(x, next) {

function closePlayer() {

/* ---------- lucky ---------- */
function lucky() {
  const pool = S.flatMap(x => linked(x).map(e => ({ x, e })));
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  toast(`🎲 ${pick.x.t} — серия ${pick.e.n}`);
  openPlayer(pick.x.id, pick.e.n);
}

/* ---------- command palette ---------- */
let pkSel = 0, pkItems = [];
function openPalette() {
  if ($('#cmdk')) return;
  const el = document.createElement('div');
  el.className = 'cmdk'; el.id = 'cmdk';
  el.innerHTML = `<div class="box">
    <input id="pkQ" placeholder="Тайтл, команда… например «кхемджира» или «повезёт»" autocomplete="off">
    <div class="lst" id="pkL"></div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) closePalette() });
  const q = $('#pkQ', el);
  q.focus();
  q.addEventListener('input', () => paletteRender(q.value));
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { pkSel = Math.min(pkSel + 1, pkItems.length - 1); paletteSel() }
    else if (e.key === 'ArrowUp') { pkSel = Math.max(pkSel - 1, 0); paletteSel() }
    else if (e.key === 'Enter') { pkItems[pkSel]?.run() }
    else if (e.key === 'Escape') closePalette();
  });
  paletteRender('');
}
function closePalette() { $('#cmdk')?.remove() }
function paletteRender(q) {
  q = q.trim().toLowerCase();
  const cmds = [
    { ic: '▶', nm: 'Продолжить просмотр', sc: 'последняя открытая серия', run: () => { const last = Object.entries(progress).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0))[0]; if (last && byId[+last[0]]) { closePalette(); openPlayer(+last[0], last[1].ep) } } },
    { ic: '🎲', nm: 'Мне повезёт', sc: 'случайная серия из коллекции', run: () => { closePalette(); lucky() } },
    { ic: '🔵', nm: 'Показать BL', sc: 'фильтр каталога', run: () => { setTab('BL'); closePalette() } },
    { ic: '🌸', nm: 'Показать GL', sc: 'фильтр каталога', run: () => { setTab('GL'); closePalette() } },
    { ic: '♥', nm: 'Избранное', sc: favs.length + ' тайтлов', run: () => { curView = 'fav'; closePalette(); renderCatalog(); $('#catalog').scrollIntoView({ behavior: 'smooth' }) } },
    { ic: '🧹', nm: 'Сбросить прогресс просмотра', sc: 'осторожно!', run: () => { progress = {}; saveMeta(); closePalette(); renderRows(); renderCatalog(); toast('Прогресс сброшен') } },
  ];
  let list = [];
  if (!q) list = cmds.slice(0, 5).map(c => ({ kind: 'cmd', ...c }));
  else {
    const ts = S.filter(x => (x.t + ' ' + x.o).toLowerCase().includes(q)).slice(0, 7)
      .map(x => ({ kind: 's', img: x.p, nm: x.t, sc: `${x.ty} · ${x.y} · ★ ${x.r}`, run: () => { closePalette(); openSeries(x.id) } }));
    const cs = cmds.filter(c => c.nm.toLowerCase().includes(q)).map(c => ({ kind: 'cmd', ...c }));
    list = [...ts, ...cs];
  }
  pkItems = list; pkSel = 0;
  const L = $('#pkL');
  if (!list.length) { L.innerHTML = `<div class="empty">Нет совпадений 🤷</div>`; return }
  L.innerHTML = (list[0].kind === 'cmd' ? `<div class="sec">Команды</div>` : `<div class="sec">Тайтлы</div>`) +
    list.map((it, i) => `<div class="it ${i === pkSel ? 'sel' : ''}" data-i="${i}">
      ${it.kind === 's' ? (it.img ? `<img src="${esc(it.img)}">` : '<div class="ic">🎬</div>') : `<div class="ic">${it.ic}</div>`}
      <div><div class="nm">${esc(it.nm)}</div><div class="sc">${esc(it.sc)}</div></div>
      ${i === pkSel ? '<kbd>Enter ↵</kbd>' : ''}</div>`).join('');
  L.querySelectorAll('.it').forEach(d => {
    d.onmouseenter = () => { pkSel = +d.dataset.i; paletteSel() };
    d.onclick = () => pkItems[pkSel]?.run();
  });
}
function paletteSel() {
  $('#pkL')?.querySelectorAll('.it').forEach(d => d.classList.toggle('sel', +d.dataset.i === pkSel));
  $('#pkL')?.querySelector(`.it[data-i="${pkSel}"]`)?.scrollIntoView({ block: 'nearest' });
}

/* ---------- boot ---------- */
function setTab(t) {
  state.t = t; curView = 'grid';
  $('#typeTabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  renderCatalog();
  $('#catalog').scrollIntoView({ behavior: 'smooth' });
}
function observeReveal() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target) } }), { threshold: .06 });
  document.querySelectorAll('.reveal:not(.on)').forEach(el => io.observe(el));
}
function init() {
  renderHero(); renderRows(); renderCatalog(); observeReveal(); updateFavCount();
  // genre + year selects
  const gs = [...new Set(S.flatMap(x => x.g))].sort((a, b) => a.localeCompare(b, 'ru'));
  $('#fGenre').innerHTML = '<option value="">Жанр: любой</option>' + gs.map(g => `<option>${esc(g)}</option>`).join('');
  const ys = [...new Set(S.map(x => x.y))].sort((a, b) => b - a);
  $('#fYear').innerHTML = '<option value="">Год: любой</option>' + ys.map(y => `<option value="${y}">${y}</option>`).join('');
  $('#typeTabs').querySelectorAll('button').forEach(b => b.onclick = () => setTab(b.dataset.t));
  $('#q').addEventListener('input', e => { state.q = e.target.value; page = 1; renderCatalog() });
  $('#fGenre').onchange = e => { state.g = e.target.value; page = 1; renderCatalog() };
  $('#fYear').onchange = e => { state.y = e.target.value && +e.target.value; page = 1; renderCatalog() };
  $('#fSort').onchange = e => { state.sort = e.target.value; renderCatalog() };
  $('#openSearch').onclick = openPalette;
  $('#diceBtn').onclick = lucky;
  $('#favBtn').onclick = () => { curView = 'fav'; renderCatalog(); $('#catalog').scrollIntoView({ behavior: 'smooth' }); toast(favs.length ? 'Твоё избранное ♥' : 'Избранное пока пусто — жми ♥ на карточках') };
  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette() }
    else if (e.key === '/' && !typing) { e.preventDefault(); openPalette() }
    else if (e.key === 'Escape') { if ($('#cmdk')) closePalette(); else if ($('#upnext')) { $('#upnext').remove(); clearTimeout(cdTimer) } else if ($('#pOvl')) closePlayer(); else if ($('#sOvl')) closeModal() }
    else if (e.shiftKey && e.key.toUpperCase() === 'N' && !typing) {
      const cur = Object.entries(progress).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0))[0];
      if (cur && byId[+cur[0]]) { const nx = byId[+cur[0]].eps.find(x2 => x2.n > cur[1].ep && x2.u); if (nx) openPlayer(+cur[0], nx.n); else toast('Дальше серий с видео нет 🎉') }
    }
  });
}
init();

</script>
