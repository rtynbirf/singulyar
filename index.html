<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SINGULYAR — Ambient Intent Organism</title>
<meta name="description" content="Смысл один. Представление — твоё. Живой Кристалл-Шар рассыпается на 17 дверей-осколков — куда человек поставил, там и стоит. Один файл · ноль интернета · 100% суверенитет.">
<meta name="theme-color" content="#0A0A0C">
<meta name="sng-build" content="v1.33.0 · ХОЗЯИН=ГОСТЬ · 2026-10-05">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="СИНГУЛЯР">
<style>
:root{--bg:#0A0A0C;--panel:#1A1D23;--line:rgba(240,240,248,.12);--tx:#C0C8D0;--dim:#8A9099;--teal:#D4AF37;--teal2:#F0D78C;--mono:'Cascadia Mono',ui-monospace,Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
a{color:var(--teal);text-decoration:none} a:hover{text-decoration:none}
main{min-height:100svh;display:flex;flex-direction:column;max-width:1060px;margin:0 auto;padding:0 20px}
/* ── ТИТУЛ = МАКЕТ (закон): только кристалл, титул, девиз, три тезиса ── */
#crystalTitle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(28px,5vh,56px) 16px clamp(20px,4vh,40px);border:0;background:none}
#crystalTitle canvas{width:min(340px,76vw);height:min(340px,76vw)}
.sng-crystal-title{margin:20px 0 4px;font-size:clamp(30px,6vw,52px);border:0;line-height:1.1;letter-spacing:.06em}
.aio-sub{color:var(--dim);letter-spacing:.24em;text-transform:uppercase;font-size:clamp(11px,1.5vw,14px)}
/* подчёрк хозяина: золотая нить с алмазом — подпись дома (как в макете) */
.подчерк{display:flex;align-items:center;gap:12px;margin:18px auto 0;width:min(320px,70vw)}
.подчерк::before,.подчерк::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,0),rgba(212,175,55,.75))}
.подчерк::after{background:linear-gradient(90deg,rgba(212,175,55,.75),rgba(212,175,55,0))}
.подчерк i{width:7px;height:7px;background:var(--teal2);transform:rotate(45deg);flex:none;box-shadow:0 0 10px rgba(240,215,140,.6)}
.motto{margin:16px 0 0;font-size:clamp(15px,2vw,18px);color:#E8E8E8}
.obj-chip{font-family:var(--mono);font-size:13px;color:#E8E8E8;border:1px solid rgba(240,240,248,.24);border-radius:999px;padding:9px 18px;background:rgba(240,240,248,.04);box-shadow:inset 0 1px 0 rgba(240,240,248,.12);transition:border-color .2s,color .2s;display:inline-block}
.obj-chip:hover{border-color:rgba(212,175,55,.55);color:#F0D78C}
.obj-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
/* ── НИТЬ АРИАДНЫ: под капотом. Открывает движок (меню дома / N / #модули) ── */
.нить[hidden]{display:none}
.нить{margin-top:auto}
.нить summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0 40px;-webkit-tap-highlight-color:transparent}
.нить summary::-webkit-details-marker{display:none}
.нить-линия{width:1px;height:110px;background:linear-gradient(180deg,rgba(212,175,55,0),rgba(212,175,55,.85) 30%,rgba(212,175,55,.85) 70%,rgba(240,215,140,0));box-shadow:0 0 12px rgba(212,175,55,.35);animation:нить-пульс 3.2s ease-in-out infinite}
.нить-слово{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#B9A468}
.нить summary:hover .нить-линия,.нить summary:focus-visible .нить-линия{box-shadow:0 0 18px rgba(212,175,55,.6)}
.нить summary:focus-visible{outline:1px solid rgba(212,175,55,.6);outline-offset:6px;border-radius:8px}
.нить[open] .нить-линия{animation:none;background:linear-gradient(180deg,rgba(212,175,55,0),rgba(212,175,55,.45))}
.нить[open] .нить-слово{color:var(--dim)}
@keyframes нить-пульс{0%,100%{opacity:.55;transform:scaleY(.92)}50%{opacity:1;transform:scaleY(1)}}
/* ── ДОМ (внутри нити): 17 дверей ── */
#дом{padding:6px 0 26px;text-align:center;animation:дом-явь .5s ease both}
@keyframes дом-явь{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#дом h2{font-size:19px;margin:0 0 8px;border:0}
#дом h2 em{font-style:normal;color:var(--teal);font-family:var(--mono);font-size:12.5px;vertical-align:middle;margin-left:8px}
.дом-тихо{color:var(--dim);font-size:13.5px;margin:0 0 20px}
.двери{display:flex;flex-wrap:wrap;gap:9px 12px;justify-content:center;max-width:860px;margin:0 auto 30px}
.дверь{font-family:var(--mono);font-size:12.5px;color:#C0C8D0;border:1px solid rgba(240,240,248,.18);border-radius:999px;padding:8px 15px;background:rgba(240,240,248,.03);transition:border-color .2s,color .2s;display:inline-block}
.дверь i{font-style:normal;color:var(--teal);margin-right:7px}
.дверь:hover{border-color:rgba(212,175,55,.55);color:#F0D78C}
@media (prefers-reduced-motion: reduce){
  .нить-линия{animation:none}
  .нить[open] #дом{animation:none}
  html{scroll-behavior:auto}
}
</style>
<link rel="stylesheet" href="singulyar-design-v3.css">
</head>
<body>
<div class="singulyar-canvas-bg" aria-hidden="true"></div>
<div class="sng-beam" aria-hidden="true"></div>
<main>
  <section id="crystalTitle" aria-label="Титул: SINGULYAR — Ambient Intent Organism">
    <button id="crystalButton" class="кристалл-кнопка" type="button" aria-expanded="false"
            aria-controls="осколкиСлой"
            aria-label="Кристалл SINGULYAR — рассыпать на двери дома">
      <canvas id="crystalHero" aria-hidden="true"></canvas>
    </button>
    <div id="осколкиСлой" class="осколки-слой" hidden></div>
    <h2 class="sng-crystal-title">SINGULYAR</h2>
    <p class="aio-sub">Ambient Intent Organism</p>
    <div class="подчерк" aria-hidden="true"><i></i></div>
    <p class="motto">Смысл один. Представление — твоё.</p>
    <div class="obj-row">
      <a class="obj-chip" href="https://github.com/rtynbirf/singulyar/releases/download/v1.12/SINGULYAR_OS_v18_20_MODULES.html">Один файл.</a>
      <a class="obj-chip" href="СИНГУЛЯР_27_ФУНДАМЕНТ.html">Ноль интернета.</a>
      <a class="obj-chip" href="СИНГУЛЯР_28_УЗЕЛ.html">100% суверенитет.</a>
    </div>
  </section>
  <script>
  /* ТИТУЛЬНЫЙ КРИСТАЛЛ-ШАР — рисует ядро SNG по эталону «как в Корел ДРО»
     (канон: ноль изображений). ОСКОЛКИ: касание рассыпает кристалл на
     17 дверей-осколков; осколок остаётся там, где человек его поставил
     (ОН РЕШАЕТ); позиция — в localStorage. */
  (function(){
    function старт(){
      try{
        if(!(window.SNG&&window.SNG.кристалл)) return;
        var c=document.getElementById('crystalHero');
        if(c) window.SNG.кристалл(c,{});
        if(window.SNG.осколки){
          var кн=document.getElementById('crystalButton');
          var слой=document.getElementById('осколкиСлой');
          if(кн&&слой) window.SNG.осколкиДвижок=window.SNG.осколки({
            кнопка:кн, слой:слой, канвас:c
          });
        }
      }catch(e){}
    }
    if(window.SNG) старт();
    else{ var s=document.querySelector('script[src*="singulyar-modules"]'); if(s) s.addEventListener('load',старт); else document.addEventListener('DOMContentLoaded',старт); }
  })();
  </script>

  <details id="модули" class="нить" hidden>
    <summary aria-label="Нить Ариадны — потянуть, чтобы открыть дом из 17 дверей">
      <span class="нить-линия" aria-hidden="true"></span>
      <span class="нить-слово">⌇ нить Ариадны</span>
    </summary>
    <div id="дом">
      <h2>Дом <em>17 дверей · каждая автономна</em></h2>
      <p class="дом-тихо">Возможность предоставлена — путь человек находит сам. Дверь открывается по нити, не по указанию.</p>
      <nav id="двери" class="двери" aria-label="Двери дома СИНГУЛЯР"></nav>
    </div>
  </details>
  <script>
  /* ДВЕРИ строит ядро SNG из манифеста (манифест — истина; ноль innerHTML).
     Нить под капотом: на лице её нет — движок дома открывает по нити. */
  (function(){
    function двери(){
      try{
        var SNG=window.SNG; if(!SNG||!SNG.карта) return;
        var бокс=document.getElementById('двери'); if(!бокс) return;
        var увидено={};
        SNG.карта().forEach(function(строка){
          строка.модули.forEach(function(m){
            if(m.файл==='index.html'||увидено[m.файл]) return;
            увидено[m.файл]=1;
            var a=document.createElement('a'); a.className='дверь'; a.href=m.файл;
            var n=document.createElement('i'); n.textContent=m.номер;
            var s=document.createElement('span'); s.textContent=m.имя;
            a.appendChild(n); a.appendChild(s);
            бокс.appendChild(a);
          });
        });
      }catch(e){}
    }
    if(window.SNG) двери();
    else{ var s=document.querySelector('script[src*="singulyar-modules"]'); if(s) s.addEventListener('load',двери); else document.addEventListener('DOMContentLoaded',двери); }
  })();
  </script>
</main>
<script>
/* PWA: регистрация только при хостинге; на file:// офлайн и так полный */
try{
  var h = location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if (h && 'serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw15.js').catch(function(){});
  }
}catch(e){}
</script>
<script defer src="./singulyar-modules.js"></script>
<script defer src="./singulyar-ux-engine-v9.js"></script></body>
