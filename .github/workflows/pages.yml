# ЛАТКА ТЫЛОВ CI 2026-11-14: развилка build→deploy (официальная схема GitHub Pages).
# Было: одна job'а «deploy» (upload+deploy вместе) — любой перезапуск упавшей job'ы
# (rerun-failed-jobs) заново исполнял шаг Upload и создавал ВТОРОЙ артефакт github-pages,
# deploy-pages валился «Multiple artifacts named "github-pages"… Artifact count is 2»
# (улики: attempts 2 и 3 прогона 43468427047; heal удалением артефактов проиграл гонку
# на 1 секунду — список артефактов тугой). Стало: шаг Deploy живёт в отдельной job'е
# needs: build — перезапуск деплоя больше не пересоздаёт артефакт.
# upload-pages-artifact v5 (пин fc324d3, обёртка upload-artifact v7) входа overwrite
# не даёт — развилка job'ов = структурный фикс, а не ручное лечение.
name: Deploy СИНГУЛЯР РУМУ to Pages

on:
  push:
    branches: [rumu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка выкладки (артефакт github-pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Дверь-0 (TH-AUDIO-45, усиление Н-4 ×30): голосовой фонд same-origin — материализация из релиза GOLOS-FOND-2026-11-15"
        run: |
          mkdir -p minus/голос
          TAGF="GOLOS-FOND-2026-11-15"
          if curl -fsSL -o /tmp/golos-sha.txt "https://github.com/rtynbirf/singulyar/releases/download/$TAGF/__SHA256SUMS.txt"; then
            # первичка: релизные ассеты (серверная загрузка, CORS не участвует); 2 попытки на файл
            grep -v '__SHA256SUMS' /tmp/golos-sha.txt | while read -r sum name; do
              f=$(basename "$name")
              curl -fsSL -o "minus/голос/$f" "https://github.com/rtynbirf/singulyar/releases/download/$TAGF/$f" \
                || curl -fsSL -o "minus/голос/$f" "https://github.com/rtynbirf/singulyar/releases/download/$TAGF/$f"
            done
            (cd minus/голос && sha256sum -c /tmp/golos-sha.txt > /tmp/sha-verify.log 2>&1) || { cat /tmp/sha-verify.log; exit 1; }
            echo "голос-фонд из релиза $TAGF: $(find minus/голос -name '*.mp3' | wc -l) файлов, $(du -sh minus/голос | cut -f1), sha256 сверены"
          elif git fetch --depth=1 origin minus-fond 2>/dev/null && git checkout FETCH_HEAD -- minus/голос 2>/dev/null; then
            # фолбэк: ветка после Н-4 (голос выпарен) — честный graceful
            echo "голос-фонд из ветки minus-fond (фолбэк): $(find minus/голос -name '*.mp3' | wc -l) файлов"
          else
            echo "голос-фонд недоступен: релиз и ветка не ответили — выкладка идёт без голос-фонда (лестница зала уведёт 404 в МИН)"
          fi
      - name: "Дверь-сборник (С186): Сборник same-origin — материализация 7 частей из релиза MINUS-FOND (паспорт дома: ДАННЫЕ/МИНУС_ФОНД_РЕЛИЗ.json)"
        run: |
          mkdir -p minus/сборник
          python3 - <<'PYEOF'
          import json, hashlib, pathlib, urllib.request
          ман = json.load(open('ДАННЫЕ/МИНУС_ФОНД_РЕЛИЗ.json', encoding='utf-8'))
          база = ман['url_база']
          сб = [x for x in ман['файлы'] if 'сборник' in x['было'] and x['было'].endswith('.mp3')]
          ок = 0
          for x in сб:
              п = pathlib.Path(x['было'])
              if not п.exists():
                  для_загрузки = база + x['ассет']
                  для_ошибки = None
                  for попыт in range(2):
                      try:
                          urllib.request.urlretrieve(для_загрузки, п)
                          break
                      except Exception as е:
                          для_ошибки = е
                  else:
                      print('релиз не ответил для %s: %s — Сборник играет с raw/jsDelivr (лестница С186 ловит зеркалом)' % (x['было'], для_ошибки))
                      continue
              х = hashlib.sha256(п.read_bytes()).hexdigest()
              assert х == x['sha256'], 'sha256 не сошёлся: ' + x['было']
              ок += 1
          print('сборник same-origin: %d частей, sha256 сверены по паспорту дома' % ок)
          PYEOF
      - name: "Дверь-дислокация (ЛАТКА 2026-11-11): живой замер релеев — материализация ветки данные-дислокация в выкладку"
        run: |
          if git fetch --depth=1 origin данные-дислокация 2>/dev/null; then
            git checkout FETCH_HEAD -- data/дислокация.json
            echo "дислокация в выкладке: замер $(python3 -c "import json;print(json.load(open('data/дислокация.json', encoding='utf-8'))['генерация'])")"
          else
            echo "ветки данные-дислокация нет — лица честно живут без строки дислокации"
          fi
      - name: "Pin Pages source to workflow (гонка legacy-main устранена)"
        run: |
          code=$(curl -s -o /tmp/pg.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "build_type pin: HTTP $code"; cat /tmp/pg.json | head -3
          # не-фатально: при отказе просто предупреждаем (гонка остаётся, но деплой живёт)
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: "Бирка деплоя: SHA выкладки в meta sng-deploy-sha (ПРАВДА-2, F-019 — след деплоя на живом лице)"
        run: |
          python3 - <<'EOF'
          import pathlib
          п = pathlib.Path('index.html')
          т = п.read_text(encoding='utf-8')
          якорь = '<!--СНГ:SHA-ДЕПЛОЯ-МЕСТО-->'
          мета = '<meta name="sng-deploy-sha" content="${{ github.sha }}">'
          assert якорь in т, 'якорь СНГ:SHA-ДЕПЛОЯ-МЕСТО не найден в index.html — прод не трогаем вслепую'
          п.write_text(т.replace(якорь, мета, 1), encoding='utf-8', newline='')
          print('sng-deploy-sha =', '${{ github.sha }}')
          EOF
          # правка живёт только в копии выкладки: в git SHA не пишется (след деплоя — на проде)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '.'

  deploy:
    name: Деплой выкладки на прод
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
