name: Deploy СИНГУЛЯР РУМУ to Pages

on:
  push:
    branches: [rumu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "Дверь-0 (TH-AUDIO-45): голосовой фонд same-origin — материализация ветки minus-fond в выкладку"
        run: |
          git fetch --depth=1 origin minus-fond
          git checkout FETCH_HEAD -- minus/голос
          echo "голос-фонд в выкладке: $(find minus/голос -name '*.mp3' | wc -l) файлов, $(du -sh minus/голос | cut -f1)"
      - name: "Дверь-дислокация (ЛАТКА 2026-11-11): живой замер релеев — материализация ветки данные-дислокация в выкладку"
        run: |
          if git fetch --depth=1 origin данные-дислокация 2>/dev/null; then
            git checkout FETCH_HEAD -- data/дислокация.json
            echo "дислокация в выкладке: замер $(python3 -c "import json;print(json.load(open('data/дислокация.json', encoding='utf-8'))['генерация'])")"
          else
            echo "ветки данные-дислокация нет — лица честно живут без строки дислокации"
          fi
      - name: "Pin Pages source to workflow (гонка legacy-main устранена)"
        run: |
          code=$(curl -s -o /tmp/pg.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "build_type pin: HTTP $code"; cat /tmp/pg.json | head -3
          # не-фатально: при отказе просто предупреждаем (гонка остаётся, но деплой живёт)
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: "Бирка деплоя: SHA выкладки в meta sng-deploy-sha (ПРАВДА-2, F-019 — след деплоя на живом лице)"
        run: |
          python3 - <<'EOF'
          import pathlib
          п = pathlib.Path('index.html')
          т = п.read_text(encoding='utf-8')
          якорь = '<!--СНГ:SHA-ДЕПЛОЯ-МЕСТО-->'
          мета = '<meta name="sng-deploy-sha" content="${{ github.sha }}">'
          assert якорь in т, 'якорь СНГ:SHA-ДЕПЛОЯ-МЕСТО не найден в index.html — прод не трогаем вслепую'
          п.write_text(т.replace(якорь, мета, 1), encoding='utf-8', newline='')
          print('sng-deploy-sha =', '${{ github.sha }}')
          EOF
          # правка живёт только в копии выкладки: в git SHA не пишется (след деплоя — на проде)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
