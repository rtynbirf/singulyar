name: Deploy СИНГУЛЯР РУМУ to Pages

on:
  push:
    branches: [rumu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin Pages source to workflow (убирает гонку: legacy-деплой main перебивал rumu)
        run: |
          code=$(curl -s -o /tmp/pg.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "build_type pin: HTTP $code"; cat /tmp/pg.json | head -3
          # не-фатально: при отказе просто предупреждаем (гонка остаётся, но деплой живёт)
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
