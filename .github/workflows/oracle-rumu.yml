name: Оракулы дома зелёные (sovereign check)

on:
  push:
    branches: [rumu]
  pull_request:
    branches: [rumu]
  workflow_dispatch:

permissions:
  statuses: write

# П-15: оракул — content-addressed страж тела РУМУ.
# Сверяет живое дерево ветки rumu с body_digest из MANIFEST.json:
# расхождение = «тело съехало за N часов» с точным указанием, не перепин
# за едущей веткой. Перепин — сознательный (tools/carrier_body_sync.py --write).
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (пин канона роя)
        with:
          fetch-depth: 1

      - name: Дайджест тела живьём + сверка с MANIFEST.json (П-15)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --depth=1 origin rumu
          python3 tools/carrier_body_sync.py --check

      - name: Статус оракула на HEAD
        if: always()
        run: |
          STATE="success"; DESC="body_digest сошёлся: тело РУМУ цело (content-addressed, П-15)"
          if [ "${{ job.status }}" != "success" ]; then
            STATE="failure"; DESC="тело РУМУ съехало от body_digest — деградация (П-15)"
          fi
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\": \"$STATE\", \"context\": \"Оракулы дома зелёные\", \"description\": \"$DESC\", \"target_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
