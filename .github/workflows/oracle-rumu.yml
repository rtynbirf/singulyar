name: Оракулы дома зелёные (sovereign check)
# Протокол тишины A-HUSH (волна ×1176, 2026-11-18):
#  Зуб 1 — грейс: дрейф такта (пин догоняет пуш) перепроверяется 3×90 с — транзитная
#  расходимость НЕ тревога; красный только при надлогом дрейфе.
#  Зуб 2 — «тревога однажды»: issue с меткой alarm:oracle-pin открывается один раз,
#  повторные красные молчат; при зелёном такте страж закрывает issue сам.
on:
  push:
    branches: [rumu]
  pull_request:
    branches: [rumu]
  workflow_dispatch:
permissions:
  statuses: write
  issues: write
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Сверка пина тела (грейс: дрейф такта — не тревога; живой пин из генома ядра cell-swarm/swarm.json, клетка singulyar)
        run: |
          set -e
          TARGET="${{ github.event.pull_request.base.sha }}"
          if [ -z "$TARGET" ]; then TARGET="${{ github.sha }}"; fi
          pin_of() {
            curl -fsSL "https://raw.githubusercontent.com/rtynbirf/cell-swarm/main/swarm.json?nocache=${GITHUB_RUN_ID}-${RANDOM}" \
              | python3 -c 'import json,sys;s=json.load(sys.stdin);print([c["pin"] for c in s["cells"] if c.get("name")=="singulyar"][0])'
          }
          for i in 1 2 3; do
            PIN=$(pin_of) || PIN=""
            if [ "$PIN" = "$TARGET" ]; then echo "ПИН СВЕРЕН (попытка $i)"; exit 0; fi
            echo "пин: ${PIN:-FETCH_FAIL} | тело: $TARGET — дрейф такта, перепроверка через 90 с (попытка $i/3)"
            sleep 90
          done
          echo "ПИН УСТАРЕЛ НАДЛОГО: make pins --write в cell-swarm"
          exit 2
      - name: Set status
        if: always()
        run: |
          STATE="success"; DESC="пин тела rumu сверен"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="пин тела rumu устарел надлого — make pins --write в cell-swarm"; fi
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\": \"$STATE\", \"context\": \"Оракулы дома зелёные\", \"description\": \"$DESC\", \"target_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - name: Разоружение (пин снова верен — страж молчит и снова вооружён)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --label "alarm:oracle-pin" --json number -q '.[].number' \
            | while read n; do gh issue close "$n" -R "$GITHUB_REPOSITORY" -c "пин сверен (run ${{ github.run_id }}) — страж разряжен, тревога снята"; done
      - name: Тревога однажды (circuit breaker)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "alarm:oracle-pin" -R "$GITHUB_REPOSITORY" --color b60205 --description "оракул пина: надлогий дрейф такта" --force 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label "alarm:oracle-pin" --json number -q 'length')
          if [ "$open" -eq 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              -t "ALARM: пин rumu устарел надлого" \
              -b "run ${{ github.run_id }} — 3 перепроверки через 90 с не сошлись. Лечение: make pins --write в cell-swarm. Пока issue открыта — страж молчит (протокол A-HUSH)." \
              -l "alarm:oracle-pin"
          else
            echo "тревога уже открыта ($open) — молчим"
          fi
