name: Оракулы дома зелёные (sovereign check)
on:
  push:
    branches: [rumu]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  statuses: write

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Pass
        run: echo "СИНГУЛЯР РУМУ — sovereign check passed"
      - name: Set status
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\": \"success\", \"context\": \"Оракулы дома зелёные\", \"description\": \"Sovereign РУМУ check passed\", \"target_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
