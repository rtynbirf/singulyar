name: Оракулы дома зелёные (sovereign check)
on:
  push:
    branches: [rumu]
  pull_request:
    branches: [rumu]
  workflow_dispatch:
permissions:
  statuses: write
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Сверка пина тела (живой пин из генома ядра cell-swarm/swarm.json, клетка singulyar)
        run: |
          set -e
          TARGET="${{ github.event.pull_request.base.sha }}"
          if [ -z "$TARGET" ]; then TARGET="${{ github.sha }}"; fi
          PIN=$(curl -fsSL "https://raw.githubusercontent.com/rtynbirf/cell-swarm/main/swarm.json?nocache=${GITHUB_RUN_ID}" | python3 -c 'import json,sys;s=json.load(sys.stdin);print([c["pin"] for c in s["cells"] if c.get("name")=="singulyar"][0])')
          echo "пин rumu: ${PIN} | текущий: ${TARGET}"
          if [ "$PIN" != "$TARGET" ]; then
            echo "ПИН УСТАРЕЛ: тело rumu ушло вперёд. Обнови пин клетки singulyar в геноме ядра: make pins --write в cell-swarm (MANIFEST.json в архиве rumu — датированная копия)."
            exit 2
          fi
          echo "ПИН СВЕРЕН: тело rumu на месте."
      - name: Set status
        if: always()
        run: |
          STATE="success"; DESC="пин тела rumu сверен"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="пин тела rumu устарел — make pins --write в cell-swarm"; fi
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\": \"$STATE\", \"context\": \"Оракулы дома зелёные\", \"description\": \"$DESC\", \"target_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
