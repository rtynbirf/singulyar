name: main-drift-watch

# Защитная пломба ADR-0004 (issue #62 п.1, T11/П-11).
# Ежедневно сравнивает main с rumu и открывает issue, если головы разошлись.
# Финальный флип дефолта — только явным решением Хозяина (см. docs/adr/0004).
#
# ИСПОЛНЕНО (issue #65, волна ×9, 2026-11-10): compare API возвращает 404,
# когда у main и rumu нет общего предка (орфанные истории — канон дома живёт
# на rumu, main осиротела). Раньше 404 плодил пломбу-issue каждый день.
# Теперь 404 — честный штат: ::notice в лог, issue НЕ открывается.
# Issue открывается только при реальном дрейфе существующих голов.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Сравнить головы (живой compare API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/compare/rumu...main")
          read -r AHEAD BEHIND STATUS <<<"$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('ahead_by','-'), d.get('behind_by','-'), d.get('status','-'))")"
          echo "rumu...main -> ahead_by=$AHEAD behind_by=$BEHIND status=$STATUS"
          {
            echo "AHEAD=$AHEAD"
            echo "BEHIND=$BEHIND"
            echo "STATUS=$STATUS"
          } >> "$GITHUB_ENV"
      - name: 404 без общего предка — честный штат (issue не открывается)
        if: env.STATUS == '404'
        run: |
          echo "::notice::compare вернул 404: у main и rumu нет общего предка (орфанные истории). Для дома singulyar это штат: канон живёт на rumu (дефолт по ADR-0004), main — осиротевшая история. Сверка голов несравнимых историй не применима — issue не открывается (исправление issue #65)."
      - name: Открыть issue при дрейфе
        if: env.STATUS != '404' && !(env.AHEAD == '0' && env.BEHIND == '0' && env.STATUS == 'identical')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const ahead = process.env.AHEAD, behind = process.env.BEHIND, status = process.env.STATUS;
            const body = 'ADR-0004 · ежедневная сверка голов\n\n' +
              'rumu...main: ahead_by=' + ahead + ' behind_by=' + behind + ' status=' + status + '\n\n' +
              'Если расхождение мешает — флип дефолта только по протоколу ADR-0004: ' +
              '(а) parity контента Pages, (б) зелёный такт-гейт на main, (в) слово Хозяина.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'ПЛОМБА: main/rumu дрейф ' + ahead + '/' + behind + ' (' + status + ') — ' + context.runId,
              body
            });
