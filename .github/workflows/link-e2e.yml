name: link-e2e

# Волна ×15 (2026-11-12): страж переходит за комплектом — теперь LINK 0.5.3
# «КОММУНИКАТОР ЧЕЛОВЕКА» (RTT, морзе-ключ, брайль, пиктограммы, письмо, duet).
# Синтаксис (server/app/duet) + юнит хаба (5 тестов, вкл. пиктограммные сигналы)
# + оба сквозных прогона (настоящий Chromium против сервера; поддельный Graph API
# Meta + настоящий WebRTC против моста). История: волна ×14 гнала 0.5.2 тем же составом.
on:
  push:
    branches: [rumu]
    paths:
      - "СВЯЗЬ/SINGULYAR-LINK-0.5.3/**"
      - ".github/workflows/link-e2e.yml"
  workflow_dispatch:

jobs:
  link:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: СВЯЗЬ/SINGULYAR-LINK-0.5.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Зависимости
        run: npm install
      - name: Синтаксис
        run: npm run check
      - name: Юнит хаба
        run: npm test
      - name: Playwright (Chromium)
        run: |
          npm i --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: E2E хаба
        run: node tests/e2e.mjs
      - name: E2E моста WhatsApp (материал Сессии-1)
        run: node tests/wa-call.e2e.mjs
