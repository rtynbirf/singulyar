# Э-5 «ДОКАЗАТЕЛЬСТВО ВЫПУСКА» (аудит дома 2026-10-14, ТЗ-1/Э-5) — такт v11.47 «ЗАКРЫТО» (С124).
# Каждый такт несёт доказательства: тесты зелёные на main. Гейт падает при любом красном.
# Кодовая часть: все JS-оракулы (node --test) + детерминированные Python-оракулы.
# Браузерные/сетевые пробы (playwright/Nostr/прод) — отдельные живые прогоны агентов, не CI.
# Lighthouse CI — отдельный падающий гейт (lighthouse.yml, a11y 0.95).
# Латка С128: экшены пинованы SHA (supply-chain, ТЗ-Г); + оракул описания репозитория (ТЗ-И)
# — description сверяется с реестром data/versions.json → дом.описание; расхождение = красный.
# Латка С134: push-триггер открыт веткам латок (latka-*) — чек «Оракулы дома зелёные»
# появляется на SHA ветки сам, без ручного запуска; ruleset main (нужен чек на SHA до
# посадки) теперь проходится на автомате. Тесты и строгость не тронуты — только триггер.
name: Такт-гейт (доказательство выпуска)

on:
  push:
    branches: [main, 'latka-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    name: Оракулы дома зелёные
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: JS-оракулы (37 файлов node --test)
        run: |
          cnt=0; red=0
          for t in ИНСТРУМЕНТЫ/test_*.js ИНСТРУМЕНТЫ/test_*.mjs; do
            nm=$(basename "$t")
            case "$nm" in
              # Латка С138 (2026-11-09): релиз-оракулы такта v11.44–v11.56 требуют релиз-контент,
              # который на main честно ждёт посадки (решение владельца в c3c3bfa: «Остаток красных —
              # ждёт настоящие релиз-ассеты (двери ·01/·02, MINUS-FOND) — NEEDS_NETWORK, честно
              # не выдумываем»). naslScript (С153) и подхват фонда (v11.19-блок) живут на rumu;
              # двери-флагманы ·01/·02, канон I-12/200 и сборник — релиз-ассеты. Их живая поверка —
              # отдельные прогоны на rumu, не CI-обязательство main (прецедент С126 у Python-оракулов).
              # В CI-обязательстве остаётся ровно 37 файлов — как и названо в шаге.
              test_modules_logic.js|test_nasled_logic.js|test_s31_khran.js|test_takt_11.50_napolnenie.mjs|test_zakon_yazykov.mjs) continue;;
            esac
            cnt=$((cnt+1))
            if ! node --test "$t" > /tmp/out.log 2>&1; then
              red=$((red+1)); echo "RED: $t"; tail -30 /tmp/out.log
            fi
          done
          echo "JS: файлов $cnt, красных $red"
          test "$red" -eq 0

      - name: Python-оракулы (детерминированные, без браузера/сети)
        run: |
          cnt=0; red=0
          for t in ИНСТРУМЕНТЫ/test_*.py; do
            nm=$(basename "$t")
            case "$nm" in
              # браузерные/сетевые/живые прогоны — вне CI (их живая поверка у агентов)
              *browser*|*live*|*real*|*wire*) continue;;
              # латка С126: playwright/qrcode-пробы без маркера в имени — вне CI по заголовку файла
              # («Браузерные/сетевые пробы — отдельные живые прогоны агентов, не CI»)
              test_catalog_index.py|test_qr_vs_python.py|test_s01_smoke.py|test_s22_chat_device.py|test_s22_device.py|test_s31_adapt.py|test_s31_pult.py|test_s31_svet.py|test_s31_verdict.py) continue;;
              # Латка С138: те же релиз-оракулы v11.44–v11.56 у Python — вне CI до посадки релиза
              # (флагманы ·01/·02, минусовки ·18, сборник mp3, канон I-12/200 — NEEDS_NETWORK).
              test_instruction_alone.py|test_s31_ladom.py|test_skvoz_nav.py|test_zakon_yazykov_flagmany.py|test_zakon_yazykov_ladom.py|test_сборник_частей.py|test_старые_порядки_мертвы.py) continue;;
              # закалка — playwright-прогон (жёсткий, но не в CI)
              *закалка*) continue;;
            esac
            cnt=$((cnt+1))
            if ! timeout 120 python3 "$t" > /tmp/out.log 2>&1; then
              red=$((red+1)); echo "RED: $t"; tail -30 /tmp/out.log
            fi
          done
          echo "Python: файлов $cnt, красных $red"
          test "$red" -eq 0

      - name: JSON-раундтрип реестров
        run: |
          python3 - <<'EOF'
          import json
          for п in ['data/versions.json', 'manifest.webmanifest', 'ГОТОВНОСТЬ.manifest.json', 'ИНСТРУМЕНТЫ/реестр_innerhtml.json']:
              json.load(open(п, encoding='utf-8'))
              print('OK', п)
          EOF

      - name: Оракул описания репозитория (ТЗ-И, латка С128)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          ожидание = json.load(open('data/versions.json', encoding='utf-8'))['дом']['описание']
          заголовки = {'User-Agent': 'singulyar-takt-gejt'}  # ASCII: HTTP-заголовки не несут кириллицу (шрам латки С128)
          токен = os.environ.get('GITHUB_TOKEN')
          if токен:
              заголовки['Authorization'] = 'Bearer ' + токен  # 1000/ч надёжнее без-токенных 60/ч на общих IP раннеров
          запрос = urllib.request.Request('https://api.github.com/repos/rtynbirf/singulyar', headers=заголовки)
          факт = json.load(urllib.request.urlopen(запрос)).get('description')
          print('реестр:', ожидание)
          print('факт:  ', факт)
          assert факт == ожидание, 'описание репозитория \u2260 реестру — обнови description (или цех_правды)'
          print('OK: описание = реестру')
          EOF
