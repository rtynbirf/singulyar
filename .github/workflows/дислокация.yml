name: Дислокация — живой замер релеев и счётчиков

# ЛАТКА 2026-11-11: числа и релеи дома меряются, а не декларируются.
# Каждые 15 минут CI пробует релеи живым WebSocket и пишет data/дислокация.json.
# Закон ветки: замер уходит в ветку данных «данные-дислокация» — rumu НЕ коммитится
# (пин-гейт оракула цел, геном cell-swarm заархивирован и пин-догон невозможен).
# После замера pages.yml пере-диспатчится и материализует свежий замер в выкладку
# (по образцу «Двери-0»: minus-fond материализуется так же).
# Ритм без шума: коммит — если замер изменился или старше часа (свежесть строки).

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: дислокация
  cancel-in-progress: false

jobs:
  zamer:   # ID job'а — только латиница/цифры/_/- (правило GitHub Actions); имя замера живёт в названии шагов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Живой замер релеев
        run: node ИНСТРУМЕНТЫ/дислокация.mjs
      - name: Ветка данных (rumu не трогаем — пин-гейт цел)
        env:
          ГХ_ТОКЕН: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp data/дислокация.json /tmp/замер.json
          git config user.name  "дислокация-автомат"
          git config user.email "дислокация-автомат@users.noreply.github.com"
          # замерщик положил свежий файл в worktree (не-трекнутый) — унести его
          # с дороги ДО ветвления, иначе сравним замер с ним же самим (урок 12:14Z)
          rm -f data/дислокация.json
          if git fetch origin данные-дислокация 2>/dev/null; then
            git checkout -B данные-дислокация FETCH_HEAD
          else
            git checkout --orphan данные-дислокация
            git rm -rf . >/dev/null 2>&1 || true
            rm -f data/дислокация.json
            mkdir -p data
          fi
          python3 - <<'PY'
          import json, pathlib, subprocess, datetime
          нов = json.load(open('/tmp/замер.json'))
          п = pathlib.Path('data/дислокация.json')
          стар = None
          if п.exists():
              try: стар = json.load(open(п, encoding='utf-8'))
              except Exception: стар = None
          сигн = lambda д: json.dumps({'релеи': д.get('релеи'), 'счётчики': д.get('счётчики')}, sort_keys=True, ensure_ascii=False)
          свеж = 1e9
          if стар:
              г = datetime.datetime.fromisoformat(стар['генерация'].replace('Z', '+00:00'))
              свеж = (datetime.datetime.now(datetime.timezone.utc) - г).total_seconds()
          изменилось = стар is None or сигн(нов) != сигн(стар)
          протухло = свеж > 3600
          if изменилось or протухло:
              п.write_text(json.dumps(нов, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
              print('пишем замер:', 'изменился' if изменилось else 'протух (>1ч) — свежесть строки честная')
          else:
              print('замер тот же и свежий (<1ч) — коммита нет (ритм без шума)')
              open('/tmp/без_шума', 'w').write('1')
          PY
          if [ -f /tmp/без_шума ]; then
            echo "замер без изменений — и пуша нет, и деплой не будим"
            exit 0
          fi
          git add data/дислокация.json
          if git diff --cached --quiet; then
            echo "в ветке уже этот замер — пуша нет"
          else
            git commit -m "дислокация: живой замер $(date -u +%FT%TZ)"
            git pull --rebase origin данные-дислокация 2>/dev/null || true
            git push origin данные-дислокация
            echo "замер ушёл в ветку данных"
          fi
      - name: Пере-диспатч Pages (замер в выкладку)
        if: success()
        env:
          ГХ_ТОКЕН: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/без_шума ]; then echo "деплой не будим — данных нет"; exit 0; fi
          curl -s -o /dev/null -w "пере-диспатч Pages: HTTP %{http_code}\n" -X POST \
            -H "Authorization: token $ГХ_ТОКЕН" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"rumu"}'
