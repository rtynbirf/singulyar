name: Эталон — Lighthouse CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установка @lhci/cli
        run: npm install -g @lhci/cli@0.14.x
      - name: LHCI autorun
        run: lhci autorun
