name: связь-e2e — приглашение собирает людей (два окна, локальный релей)

# Волна ×11 «Связь» (issue #68 п.5): живой прогон «приглашение собирает
# людей» был доказан волной руками (два окна Chromium) — теперь он стоит
# стражем в CI. Стенд детерминированный: все wss-релеи переезжают на
# локальный фейк-NIP-01-релей (ИНСТРУМЕНТЫ/фейк-релей-nip01.mjs, RFC 6455
# руками, ноль внешних зависимостей и ноль внешней сети), BroadcastChannel
# изолирован синглтоном на окно — меж окнами живёт только релей.
# Запуск: при правке проводки связи (·22, зал-код, sg-registry) и по руке.

on:
  workflow_dispatch:
  push:
    branches: [rumu]
    paths:
      - 'СИНГУЛЯР_22_СВЯЗЬ.html'
      - 'js/зал-код.js'
      - 'js/sg-registry.js'
      - 'ИНСТРУМЕНТЫ/test_приглашение_22.mjs'
      - 'ИНСТРУМЕНТЫ/фейк-релей-nip01.mjs'
      - '.github/workflows/связь-e2e.yml'

permissions:
  contents: read

concurrency:
  group: связь-e2e
  cancel-in-progress: true

jobs:
  svyaz-e2e:   # ID job'а — только латиница/цифры/_/- (правило GitHub Actions; урок c4153a5)
    runs-on: ubuntu-24.04   # Playwright 1.57 (chromium-1200) знает 24.04; ubuntu-latest = 26.04 — ещё не поддержан
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Playwright (пакет) и запасной браузер — CDN playwright, apt-зеркало не трогаем
        # Ран 43041932304: apt-зеркало azure.archive хронически не резолвится,
        # --with-deps висит до таймаута job. Runner ubuntu-24.04 несёт
        # предустановленный Google Chrome — страж стартует по channel:chrome,
        # а этот шаг лишь кладёт пакет playwright и (если CDN доступен)
        # браузер chromium как первый выбор стража.
        run: |
          set -e
          npm i --no-save playwright@1.57.0
          npx playwright install chromium || echo "браузер playwright недоступен — страж возьмёт предустановленный Chrome (channel:chrome)"
      - name: Страж «приглашение собирает людей»
        run: node --test ИНСТРУМЕНТЫ/test_приглашение_22.mjs
