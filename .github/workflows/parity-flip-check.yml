name: Parity-флип (ADR-0004/0005)

# П52 (issue #64): автопроверка флип-протокола дефолта rumu→main.
# (а) parity контента Pages, (б) зелёный такт-гейт на main — машинно;
# (в) слово Хозяина — label owner-approved на #63 (не-машинный триггер).
# Отчёт публикуется комментарием в issue #63 (update-or-create по маркеру).
# Протокол: docs/adr/0004 + docs/adr/0005. ort-wasm детектор: docs/ORT-WASM-DEDUP.md.

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (rumu)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch main (tip для git diff)
        run: |
          git fetch --no-tags --depth 1 origin \
            +refs/heads/main:refs/remotes/origin/main

      - name: Самотесты гейтов (жёсткий гейт)
        run: |
          python3 scripts/parity_flip_report.py --selftest
          python3 scripts/ort_wasm_dupes.py --selftest

      - name: Собрать живой отчёт parity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/parity_flip_report.py --render > parity-report.md
          {
            echo
            echo "---"
            python3 scripts/ort_wasm_dupes.py
          } >> parity-report.md
          head -30 parity-report.md

      - name: Опубликовать отчёт в #63 (update-or-create)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- parity-flip-report:adr-0004/0005 -->';
            const body = fs.readFileSync('parity-report.md', 'utf8');
            const issue_number = 63;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const mine = comments.filter(
              (c) => c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );
            if (mine.length) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine[mine.length - 1].id,
                body,
              });
              console.log('отчёт обновлён в комментарии ' + mine[mine.length - 1].html_url);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
              console.log('отчёт опубликован: ' + created.html_url);
            }

      - name: ort-wasm детектор — дедуп ещё не исполнен? (видимый индикатор)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ort_wasm_dupes.py --check
