name: "Доктор гейтов — самозажив транзиентов (волна 7)"

# КЛАСС КОСЯКА (вскрыт байтами волной 7, 2026-11-11):
#   2026-11-10 10:01–15:47 UTC — инцидент хранилища GitHub Actions:
#   «Deploy СИНГУЛЯР РУМУ to Pages» упал с error_count:10 + «Timeout reached,
#   aborting!» при ЗДОРОВОМ дереве — те же 2091 файл/122.8 MB заливаются за
#   5 секунд (attempt 2, run 42822221907). Пломба волны 6 «нужен scoped-путь»
#   опровергнута: зеркало живое (двери 31/32 грузят КАРАОКЕ/{id}.js, sw15
#   пре-кэшит ДАННЫЕ/…) и выкачивать его из выкладки нельзя.
# ЛЕКАРСТВО (класс, не симптом): ровно ОДИН автоматический реран упавших jobs.
# КОНЕЧНЫЙ АВТОМАТ (закон дома): attempt=1 красный → реран → attempt=2 —
#   ФИНАЛЬНОЕ состояние (не лечится никогда); event=workflow_run не лечится
#   (доктор доктора запрещён). Терминация доказана условием if.
# ТИШИНА (I0): реран не создаёт нотификаций, не пишет issue/комментарии.
# ЧЕСТНОСТЬ: если API отклонил реран — причина ложится в лог, доктор выходит 0;
#   основной гейт остаётся красным — ничто не подмазывается.

on:
  workflow_run:
    workflows:
      - "Deploy СИНГУЛЯР РУМУ to Pages"
    types: [completed]

permissions:
  actions: write

concurrency:
  group: doctor-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  heal:
    name: "Один реран упавших jobs (attempt 2 — финал)"
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Реран упавших jobs (только API, без checkout)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid="${{ github.event.workflow_run.id }}"
          code=$(curl -s -o /tmp/heal.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: polimat-wave7-doctor" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${rid}/rerun-failed-jobs")
          echo "доктор: rerun-failed-jobs(run=$rid) -> HTTP $code"
          head -c 300 /tmp/heal.json; echo
          case "$code" in
            201|202) echo "доктор: реран принят — attempt 2 пошёл (финальная попытка)" ;;
            *) echo "доктор: реран отклонён (HTTP $code) — честно остаёмся в логе, гейт не подмазан" ;;
          esac
