var M=JSON.parse(document.getElementById('manifest').textContent);
var grid=document.getElementById('grid'),cur=0,shown=[];
function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e}
function draw(){
  grid.innerHTML='';shown=[];
  var f=document.querySelector('.flt.on').dataset.f;
  M.forEach(function(it,i){
    if(f!=='all'&&it.s!==f)return;
    shown.push(i);
    var c=el('div','card');c.dataset.i=i;
    var im=el('img');im.loading='lazy';im.src=it.f;im.alt='Муза '+it.n+' — '+it.k;
    var cap=el('div','cap');var b=el('b');b.textContent=it.n;
    var st=el('i');st.textContent=(it.s==='живая'?'◆ живая':'◇ свод')+' · '+it.k;
    cap.appendChild(b);cap.appendChild(st);
    var tg=el('span','tag '+(it.s==='живая'?'live':'svod'));tg.textContent=it.s.toUpperCase();
    var nm=el('span','num');nm.textContent='№'+it.num;
    c.appendChild(im);c.appendChild(cap);c.appendChild(tg);c.appendChild(nm);
    c.addEventListener('click',function(){openLb(shown.indexOf(i))});
    grid.appendChild(c);
  });
  document.getElementById('cnt').textContent='показано '+shown.length;
}
document.querySelectorAll('.flt').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.flt').forEach(function(x){x.classList.remove('on')});
    btn.classList.add('on');draw();
  });
});
var lb=document.getElementById('lb'),lbi=document.getElementById('lbi'),lbn=document.getElementById('lbn'),lbd=document.getElementById('lbd');
function openLb(k){cur=k;render();lb.classList.add('open');document.body.style.overflow='hidden'}
function render(){var it=M[shown[cur]];lbi.src=it.f;lbi.alt=it.n;lbn.textContent='№'+it.num+' · '+it.n+' · '+(it.s==='живая'?'ЖИВАЯ КОМНАТА':'СВОД АРХИВА')+' · '+it.k.toUpperCase();lbd.textContent=it.d}
function closeLb(){lb.classList.remove('open');document.body.style.overflow=''}
function step(d){cur=(cur+d+shown.length)%shown.length;render()}
document.getElementById('x').onclick=closeLb;
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
lb.addEventListener('click',function(e){if(e.target===lb)closeLb()});
document.addEventListener('keydown',function(e){
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='ArrowRight')step(1);
});
draw();
/* звёздная пыль кузни */
(function(){
  var cv=document.getElementById('stars'),ctx=cv.getContext('2d'),W,H,stars=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=[];
    for(var i=0;i<150;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*Math.PI*2,s:.004+Math.random()*.012});
  }
  rs();addEventListener('resize',rs);
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(function(st){
      st.p+=st.s;var a=.25+.45*(1+Math.sin(st.p))/2;
      ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);ctx.fillStyle='rgba(200,160,90,'+a.toFixed(3)+')';ctx.fill();
    });
    if(!still)requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
