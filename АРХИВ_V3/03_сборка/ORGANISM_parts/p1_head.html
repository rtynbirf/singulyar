<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ORGANISM — живой прототип · поколение 1</title>
<meta name="description" content="Живой прототип интерфейса: сингулярное, эмерджентное, инженерное. Один файл, ноль зависимостей, среда, которая мутирует у вас на глазах.">
<style>
:root{
  --hue:168; --hue2:288; --radius:14px;
  --bg:#05070a; --panel:rgba(255,255,255,.035); --line:rgba(255,255,255,.09);
  --tx:#e9f1f4; --dim:#93a3ad;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --sans:"Inter","SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.65;overflow-x:hidden}
::selection{background:hsl(var(--hue) 90% 60% / .35)}
:focus-visible{outline:2px solid hsl(var(--hue) 90% 60%);outline-offset:2px}
#field{position:fixed;inset:0;z-index:0;display:block}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(1100px 650px at 50% 18%,transparent 0%,rgba(5,7,10,.5) 70%,rgba(5,7,10,.92) 100%)}
main,footer{position:relative;z-index:2}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
a{color:hsl(var(--hue) 90% 68%)}
h1,h2,h3{line-height:1.12;letter-spacing:-.02em}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:18px;
  padding:11px 22px;background:rgba(5,7,10,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.brand{font-weight:700;letter-spacing:.09em;color:var(--dim);white-space:nowrap}
.brand b{color:hsl(var(--hue) 90% 62%)}
.genom-mini{display:flex;align-items:center;gap:10px;color:var(--dim);white-space:nowrap}
.genom-mini b{color:var(--tx)}
.dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--hue) 90% 60%);
  box-shadow:0 0 14px hsl(var(--hue) 90% 60%);transition:background .8s}
.meter{width:64px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;width:40%;transition:width .9s,background .9s}
.gen{border:1px solid hsl(var(--hue) 90% 60% / .5);color:hsl(var(--hue) 90% 70%);
  padding:1px 8px;border-radius:999px}
.hud nav{margin-left:auto;display:flex;gap:16px}
.hud nav a{color:var(--dim);text-decoration:none}
.hud nav a:hover{color:hsl(var(--hue) 90% 68%)}
#clock{color:var(--dim);font-variant-numeric:tabular-nums}
@media(max-width:940px){.genom-mini{display:none}}
@media(max-width:640px){.hud nav{display:none}.hud{justify-content:space-between}}

/* ---------- HERO ---------- */
.hero{min-height:94vh;display:flex;flex-direction:column;justify-content:center;padding-top:110px;padding-bottom:40px}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.hero h1{font-size:clamp(42px,7.2vw,92px);font-weight:800;margin:18px 0 22px}
.hero h1 em{font-style:normal;
  background:linear-gradient(92deg,hsl(var(--hue) 95% 62%),hsl(var(--hue2) 95% 66%),hsl(var(--hue) 95% 62%));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pan 9s linear infinite}
@keyframes pan{to{background-position:220% 0}}
.lead{max-width:760px;font-size:clamp(15.5px,1.6vw,18.5px);color:#c3d0d8}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 8px}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:hsl(var(--hue) 90% 72%);
  border:1px solid hsl(var(--hue) 90% 60% / .5);padding:6px 13px;border-radius:999px;white-space:nowrap}
.status{font-family:var(--mono);font-size:13px;color:var(--dim);min-height:1.6em;margin-top:14px}
.status .prompt{color:hsl(var(--hue) 90% 62%)}
.caret{display:inline-block;width:8px;height:14px;background:hsl(var(--hue) 90% 62%);
  vertical-align:-2px;margin-left:2px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px}
.btn{font-family:var(--mono);font-size:13px;letter-spacing:.04em;cursor:pointer;border-radius:10px;
  padding:12px 20px;text-decoration:none;transition:filter .25s,border-color .25s,background .25s}
.btn.primary{background:hsl(var(--hue) 85% 55%);border:1px solid transparent;color:#031410;font-weight:700}
.btn.primary:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.ghost:hover{border-color:hsl(var(--hue) 90% 60% / .6)}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.hint b{color:hsl(var(--hue) 90% 70%)}

/* ---------- СЕКЦИИ ---------- */
.sec{padding:84px 0 26px}
h2{font-size:clamp(27px,3.8vw,44px);font-weight:800;margin:14px 0 26px}
.sec-lead{max-width:720px;color:#c3d0d8;margin:-8px 0 30px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:920px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;
  transition:border-color .5s,transform .5s,box-shadow .5s}
.card:hover{border-color:hsl(var(--hue) 90% 60% / .4);transform:translateY(-3px)}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--dim)}
.card h3{font-size:21px;margin:10px 0 8px}
.era-lead{font-size:14px;color:#b9c7d0;margin-bottom:14px}
.card ul{list-style:none}
.card li{position:relative;padding-left:17px;margin:9px 0;font-size:14px;color:#c6d3da}
.card li::before{content:"—";position:absolute;left:0;color:hsl(var(--hue) 90% 60%)}
.patterns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.patterns span{font-family:var(--mono);font-size:11px;color:var(--dim);
  border:1px dashed var(--line);padding:4px 9px;border-radius:8px}
.era.future{border-color:hsl(var(--hue2) 95% 62% / .55);
  background:linear-gradient(165deg,hsl(var(--hue2) 95% 60% / .1),transparent 55%);
  animation:breath 5s ease-in-out infinite}
@keyframes breath{50%{box-shadow:0 0 34px hsl(var(--hue2) 95% 60% / .18)}}
.era.future .tag{color:hsl(var(--hue2) 95% 70%)}

/* ---------- ПЛАН ---------- */
.h-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.h-code{font-family:var(--mono);font-size:12.5px;font-weight:700;color:hsl(var(--hue) 90% 65%)}
.state{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim)}
.state.done{border-color:hsl(158 80% 55% / .6);color:#7de8b8}
.state.run{border-color:hsl(var(--hue) 90% 60% / .6);color:hsl(var(--hue) 90% 72%)}
.state.goal{border-color:hsl(var(--hue2) 95% 62% / .6);color:hsl(var(--hue2) 95% 72%)}
.h-card p{font-size:14px;color:#c6d3da;margin-bottom:16px}
.prog{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:hsl(var(--hue) 90% 60%);transition:width 1.4s .2s ease}
.pct{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:7px;display:block}

/* ---------- ЛАБОРАТОРИЯ ---------- */
.lab{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:920px){.lab{grid-template-columns:1fr}}
.gene{display:grid;grid-template-columns:96px 1fr 54px;gap:12px;align-items:center;
  font-family:var(--mono);font-size:12px;margin:13px 0}
.gene .name{color:var(--dim)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:hsl(var(--hue) 90% 60%);transition:width .8s}
.gene .val{text-align:right;font-variant-numeric:tabular-nums}
.lab-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.log-title{font-size:15px;margin-bottom:12px;font-family:var(--mono);letter-spacing:.06em}
.log{max-height:330px;overflow:auto;font-family:var(--mono);font-size:12px;color:#b9c7d0;
  display:flex;flex-direction:column;gap:7px;scrollbar-width:thin}
.log-line span{color:var(--dim);margin-right:9px}
.log-line{overflow-wrap:anywhere}
.log-line.hl{color:hsl(var(--hue) 90% 72%)}

/* ---------- ИНЖЕНЕРИЯ ---------- */
.layer{display:grid;grid-template-columns:58px 230px 1fr;gap:16px;align-items:baseline;
  border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);
  padding:15px 19px;margin:9px 0;transition:border-color .4s}
.layer:hover{border-color:hsl(var(--hue) 90% 60% / .45)}
.layer .code{font-family:var(--mono);font-weight:700;color:hsl(var(--hue) 90% 65%)}
.layer .l-name{font-weight:600;font-size:14.5px}
.layer .l-desc{font-size:13.5px;color:#b9c7d0}
@media(max-width:820px){.layer{grid-template-columns:1fr;gap:4px}}
.p-chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.p-chips .chip{color:var(--dim);border-color:var(--line)}

/* ---------- ПОДВАЛ / ПРОЧЕЕ ---------- */
footer{border-top:1px solid var(--line);margin-top:90px;padding:44px 0 46px}
footer p{max-width:760px;color:#b9c7d0;font-size:14.5px}
footer .tiny{margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
[data-rv]{opacity:0;transform:translateY(20px);transition:opacity .75s ease,transform .75s ease}
[data-rv].in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>
