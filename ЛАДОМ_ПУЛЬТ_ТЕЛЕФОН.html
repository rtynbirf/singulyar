<div id="flash"></div>
<script>
(function(){
"use strict";
var st=document.getElementById("st"), fl=document.getElementById("flash");
var bc=null, seen=false, curTheme=null;
function flash(t){ fl.textContent=t; fl.classList.add("show"); setTimeout(function(){fl.classList.remove("show");},900); }
function send(cmd,arg,delta){
  if(!bc){ flash("канала нет — открой сцену на том же адресе"); return; }
  bc.postMessage({t:"kv12r",cmd:cmd,arg:arg,delta:delta});
  flash(cmd+(arg?" "+arg:""));
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-cmd]"); if(!b)return;
  document.querySelectorAll("button.on").forEach(function(x){x.classList.remove("on");});
  b.classList.add("on");
  send(b.dataset.cmd,b.dataset.arg,b.dataset.delta?parseInt(b.dataset.delta,10):undefined);
  if(b.dataset.cmd==="theme") markTheme(b.dataset.arg);
});
function markTheme(k){ curTheme=k;
  document.querySelectorAll('button[data-cmd="theme"]').forEach(function(x){ x.classList.toggle("on", x.dataset.arg===k); });
}
function connect(){
  try{ bc=new BroadcastChannel("kv-scene-v1"); }catch(e){ st.textContent="BroadcastChannel недоступен в этом браузере"; return; }
  bc.onmessage=function(ev){
    var m=ev&&ev.data; if(!m)return;
    if(m.t==="kv12s"&&m.state){
      seen=true;
      var s=m.state, t=s.time!=null?Math.floor(s.time/60)+":"+("0"+Math.floor(s.time%60)).slice(-2):"—";
      var d=s.dur!=null?Math.floor(s.dur/60)+":"+("0"+Math.floor(s.dur%60)).slice(-2):"—";
      st.innerHTML="сцена отвечает ✓ · режим: <b>"+(s.mode||"—")+"</b> · время: <b>"+t+"</b> / "+d+"<br>подача: <b>"+(s.theme||"—")+"</b> · строка 1: <b>"+(s.lyr||"—")+"%</b>";
      markTheme(s.theme);
    } else if(m.t==="kv12ack"){ /* ack тихо */ }
  };
  setInterval(function(){ if(bc)bc.postMessage({t:"kv12r",cmd:"state"}); },2000);
  setInterval(function(){ if(!seen) st.textContent="ищу сцену на канале kv-scene-v1… (открой ЛАДОМ на том же адресе)"; },2500);
}
connect();
})();
</script>
