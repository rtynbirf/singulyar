<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ЛАДОМ — пространство своих. Споём вместе. Чистый модульный прототип.">
  <!-- Пример жёсткого CSP (в реальном деплое nonce генерируется сервером) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>ЛАДОМ · v0.2.0 · Просто люби</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app" role="application" aria-label="ЛАДОМ — караоке-вечер">

    <header class="header">
      <div class="brand">
        <span class="logo">ЛАДОМ</span>
        <span class="ver" id="app-version">v0.2.0</span>
      </div>
      <nav class="header-actions" aria-label="Основные действия">
        <button type="button" id="btn-help" class="btn-ghost" aria-label="Справка">?</button>
      </nav>
    </header>

    <main class="stage">
      <h1 class="title">Споём <span class="accent">вместе</span></h1>
      <p class="subtitle" id="song-meta">«Просто люби» · RUVSON</p>

      <section class="voices-block" aria-labelledby="voices-label">
        <span id="voices-label">сколько нас?</span>
        <div class="voices-controls">
          <button type="button" id="voice-minus" class="btn-circle" aria-label="Убрать голос">−</button>
          <span id="voice-count" class="voice-count" aria-live="polite">3</span>
          <button type="button" id="voice-plus" class="btn-circle" aria-label="Добавить голос">+</button>
        </div>
        <div id="voice-pills" class="voice-pills" role="list" aria-label="Список голосов"></div>
      </section>

      <section class="modes" role="group" aria-label="Режим исполнения">
        <button type="button" class="mode active" data-mode="together" aria-pressed="true">Все вместе</button>
        <button type="button" class="mode" data-mode="relay" aria-pressed="false">Эстафета</button>
        <button type="button" class="mode" data-mode="canon" aria-pressed="false">Канон</button>
      </section>

      <section id="lyrics" class="lyrics" aria-live="polite" aria-atomic="false" tabindex="0">
        <div class="line placeholder">Нажми «Начать вечер»</div>
      </section>

      <div class="progress-block">
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
    </main>

    <footer class="dock">
      <button type="button" id="btn-play" class="btn-play" aria-label="Пуск">▶</button>
      <button type="button" id="btn-restart" class="btn-icon" aria-label="Заново">↻</button>
      <button type="button" id="btn-clap" class="btn-clap" aria-label="Хлопок">
        ХЛОП! <span id="clap-count">0</span>
      </button>
      <button type="button" id="btn-start" class="btn-start">Начать вечер</button>
    </footer>

    <!-- Справка (скрыта по умолчанию) -->
    <div id="help-dialog" class="dialog" hidden role="dialog" aria-labelledby="help-title" aria-modal="true">
      <div class="dialog-content">
        <h2 id="help-title">Справка</h2>
        <ul>
          <li><kbd>Пробел</kbd> — хлопок (или старт, если ещё не начали)</li>
          <li><kbd>R</kbd> — заново</li>
          <li><kbd>Esc</kbd> — закрыть справку</li>
        </ul>
        <p>Режимы: «Все вместе» — все поют всё. «Эстафета» — строки по голосам. «Канон» — вход со сдвигом.</p>
        <button type="button" id="help-close" class="btn-start">Закрыть</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
