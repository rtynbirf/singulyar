<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#888}
svg{display:block;width:100vw;height:100vh}
</style></head>
<body>
<script>
/* v1.53.0: многоразовая сцена — агент кладёт base64 SVG, скриншот ровно размера окна */
window.положить = function (б64) {
  var текст = atob(б64);
  var контейнер = document.createElement('div');
  контейнер.innerHTML = текст;
  var узел = контейнер.querySelector('svg');
  if (!узел) throw new Error('нет svg');
  var старый = document.querySelector('body > svg');
  if (старый) старый.parentNode.removeChild(старый);
  document.body.appendChild(узел);
};
</script>
</body></html>
